# Tells Grafana to auto-load any dashboard JSON dropped in ../../dashboards
# (mounted at /var/lib/grafana/dashboards in the container).
apiVersion: 1

providers:
  - name: demo-monitor
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
