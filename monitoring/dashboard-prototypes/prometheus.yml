global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: server-health-demo
    scrape_timeout: 3s
    static_configs:
      - targets: ['server-health-demo-exporter:9100']

  - job_name: cisco-switch-demo
    scrape_timeout: 3s
    static_configs:
      - targets: ['cisco-switch-demo-exporter:9101']

  - job_name: vccu-fspu-demo
    scrape_timeout: 3s
    static_configs:
      - targets: ['vccu-fspu-demo-exporter:9102']

  - job_name: vlan-net-viewer-demo
    scrape_timeout: 3s
    static_configs:
      - targets: ['vlan-net-viewer-demo-exporter:9103']
