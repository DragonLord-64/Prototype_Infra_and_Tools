---
- name: Validate installation and endpoint settings
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - filebeat_package_path | length > 0
      - filebeat_credentials_file | length > 0
      - filebeat_elasticsearch_hosts is sequence and filebeat_elasticsearch_hosts is not string
      - filebeat_elasticsearch_hosts | length > 0
      - filebeat_elasticsearch_hosts | select('match', '^https?://') | list | length == filebeat_elasticsearch_hosts | length
      - filebeat_package_path.endswith('.deb')
      - filebeat_ssl_verification_mode in ['full', 'strict', 'certificate']
      - filebeat_fingerprint_length | int >= 64
      - filebeat_file_inputs_enabled | bool or filebeat_journald_enabled | bool or filebeat_extra_inputs | length > 0
    fail_msg: Set controller package/credentials paths and reachable Elasticsearch URLs for a supported Linux package.

- name: Load controller-side publishing credentials (Vault supported)
  ansible.builtin.include_vars:
    file: "{{ filebeat_credentials_file }}"
    name: filebeat_credentials
  no_log: true

- name: Validate publishing credentials
  ansible.builtin.assert:
    that:
      - filebeat_credentials.filebeat_elasticsearch_username | default('') | length > 0
      - filebeat_credentials.filebeat_elasticsearch_password | default('') | length > 0
    fail_msg: Credentials file must define filebeat_elasticsearch_username and filebeat_elasticsearch_password.
  no_log: true

- name: Copy local package to target
  ansible.builtin.copy:
    src: "{{ filebeat_package_path }}"
    dest: "{{ filebeat_remote_package_path }}"
    owner: root
    group: root
    mode: '0600'

- name: Install local Debian package without adding repositories
  ansible.builtin.apt:
    deb: "{{ filebeat_remote_package_path }}"
    state: present
  when: ansible_facts.os_family == 'Debian'
  notify: Restart filebeat

- name: Inspect installed Filebeat version
  ansible.builtin.command:
    argv: ["{{ filebeat_binary }}", version]
  register: filebeat_installed_version
  changed_when: false
  when: not ansible_check_mode

- name: Require the selected Filebeat major version
  ansible.builtin.assert:
    that:
      - filebeat_installed_version.stdout is search('filebeat version ' ~ filebeat_expected_major_version ~ '\.')
    fail_msg: Use a Filebeat package compatible with the Elasticsearch version; this role defaults to Filebeat 9.
  when: not ansible_check_mode

- name: Ensure root-owned configuration and runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop:
    - "{{ filebeat_config_path | dirname }}"
    - "{{ filebeat_path_data }}"
    - "{{ filebeat_path_logs }}"

- name: Render and validate Filebeat configuration
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: "{{ filebeat_config_path }}"
    owner: root
    group: root
    mode: '0600'
    validate: "{{ filebeat_binary }} test config --path.home {{ filebeat_path_home }} --path.data {{ filebeat_path_data }} -c %s"
  no_log: true
  diff: false
  notify: Restart filebeat

- name: Test Elasticsearch connectivity using the deployed configuration
  ansible.builtin.command:
    argv:
      - "{{ filebeat_binary }}"
      - test
      - output
      - --path.home
      - "{{ filebeat_path_home }}"
      - --path.data
      - "{{ filebeat_path_data }}"
      - -c
      - "{{ filebeat_config_path }}"
  changed_when: false
  no_log: true
  when: filebeat_validate_output | bool and not ansible_check_mode

- name: Apply pending configuration restart
  ansible.builtin.meta: flush_handlers

- name: Enable and start Filebeat
  ansible.builtin.systemd_service:
    name: filebeat
    enabled: true
    state: started
