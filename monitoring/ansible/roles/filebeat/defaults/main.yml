---
logging_service_default: logging
logging_kubeconfig_path: /etc/kubernetes/admin.conf

logging_filebeat_oci_engine: docker
logging_filebeat_data_dir: /var/lib/filebeat
logging_filebeat_certificate_name: "{{ inventory_hostname }}-filebeat"

logging_filebeat_name: filebeat
logging_filebeat_version: 9.3.3
logging_filebeat_image: "docker.elastic.co/beats/filebeat:{{ logging_filebeat_version }}"
logging_filebeat_user: root
logging_filebeat_log_options:
  max-size: "10m"
  max-file: "3"
  labels: "org.ska.app.group"
logging_filebeat_labels:
  org.ska.app.group: logging

# ### Docker Resource Variables
# logging_filebeat_server_cpus:
logging_filebeat_server_memory: 512M
# logging_filebeat_server_memory_swap:
# logging_filebeat_server_memory_swappiness:

# https://www.elastic.co/guide/en/beats/filebeat/current/configuring-internal-queue.html
logging_filebeat_queue_mem_events: 4096
logging_filebeat_queue_mem_flush_timeout: 5s
logging_filebeat_queue_disk_enabled: false
logging_filebeat_queue_disk_max_size: 10GB
logging_filebeat_queue_disk_read_ahead: 512
logging_filebeat_queue_disk_write_ahead: 2048
logging_filebeat_workers: 1
logging_filebeat_identity: native # If using fingerprint, files smaller than 1kb are not picked up
# From https://www.elastic.co/guide/en/beats/filebeat/8.19/configuring-internal-queue.html:
# As of 8.13, there is never a performance advantage to limiting batch size with flush.min_events instead of bulk_max_size
logging_filebeat_bulk_max_size: 1600
logging_filebeat_http_enabled: false

logging_filebeat_http_authentication_required: "{{ (elasticsearch_http_authentication in ['required']) | default(True) }}"
# When using optional/none mode, we can trust the CA by providing its fingerprint instead of having the actual
# certificate. Defaulting to the one used in the "global" elasticsearch. Generate using:
# openssl x509 -fingerprint -sha256 -noout -in ca.pem | awk --field-separator="=" '{print $2}' | sed 's/://g'
logging_filebeat_ca_fingerprint: >
  {{
    None if logging_filebeat_http_authentication_required else (_ | mandatory('`logging_filebeat_ca_fingerprint` definition is mandatory'))
  }}

logging_filebeat_env_variables: {}
logging_filebeat_env_defaults:
  - strict.perms: "false"

logging_filebeat_elasticsearch_address: "{{ _ | mandatory('`logging_filebeat_elasticsearch_address` definition is mandatory') }}"
logging_filebeat_elasticsearch_url: "https://{{ logging_filebeat_elasticsearch_address }}:{{ elasticsearch_api_port }}"
logging_filebeat_elasticsearch_auth_method: 'basic'
logging_filebeat_elasticsearch_user: 'elastic'
# Can be an elasticsearch api-key when logging_filebeat_elasticsearch_auth_method: 'api-key'
logging_filebeat_elasticsearch_password: "{{ _ | mandatory('`logging_filebeat_elasticsearch_password` definition is mandatory') }}"

# Files to be excluded in /var/log/
logging_filebeat_exclude_var_log_files: []

logging_filebeat_ilm_enabled: true

# NOTE: Choose index patterns carefully so that they are meaningful and easy to identify. Also, historically we
# allow anonymous access to "filebeat-*" so don't prefix - by principle - your indices with that.
# Example pattern: <environment fqdn>-<context> (ie: stfc-techops-production-infrastructure)

logging_filebeat_overwrite_default_index_template: false

# Pre/post processors for containers scrapers
logging_filebeat_containers_pre_processors: []
logging_filebeat_containers_post_processors: []

logging_filebeat_indices: []
  # - prefix: <index prefix without agent version>
  #   overwrite: null # optional, defaults to true (ilm policy and index template)
  #   ilm_policy_name: null # optional, defaults to the prefix
  #   ilm_policy_config: null # optional, merged with logging_filebeat_ilm_policy_config
  #     # rollover_max_size: 20gb
  #     # rollover_ttl: 1d
  #     # delete_ttl: 7d
  #   description: null # optional
  #   pipeline_enabled: null # defaults to `logging_filebeat_pipeline_enabled`
  #   pipeline_name: null # defaults to `logging_filebeat_pipeline_name`
  #   when: [] # See https://www.elastic.co/docs/reference/beats/filebeat/defining-processors#conditions | filebeat will send to first match

# These are the default index configurations used with filebeat built-in ILM or
# direct (ES API) ILM configuration. If using multiple indices, this is the default one.
logging_filebeat_index_pattern_prefix: filebeat
logging_filebeat_ilm_policy: filebeat
logging_filebeat_ilm_policy_default_config:
  rollover_max_size: 20gb
  rollover_ttl: 1d
  delete_ttl: 7d
logging_filebeat_ilm_policy_extra_config: {}
logging_filebeat_ilm_policy_config: "{{ logging_filebeat_ilm_policy_default_config | combine(logging_filebeat_ilm_policy_extra_config, recursive=True) }}"

logging_filebeat_add_fields:
  - name: ska.datacentre
    value: "{{ ska_datacentre | default('') }}"
  - name: ska.environment
    value: "{{ ska_environment | default('') }}"
  - name: ska.service
    value: "{{ ska_service | default(logging_service_default) }}"
  # Required to allow a "bind" between logs and metrics
  - name: ska.prometheus_datacentre
    value: "{{ logging_filebeat_prometheus_datacentre | default([(ska_datacentre | default('')), (ska_environment | default(''))] | join('-')) }}"

logging_filebeat_volumes:
  # configurations
  - "/etc/filebeat.yml:/etc/filebeat.yml:ro"
  - "/var/lib/filebeat:/usr/share/filebeat/data/registry/filebeat:rw"
  # machine info
  - "/run/systemd:/run/systemd:ro"
  - "/etc/hostname:/etc/hostname:ro"
  - "/etc/machine-id:/etc/machine-id:ro"
  # generic logs
  - "/var/log:/var/log:ro"

logging_filebeat_ilm_volumes:
  - "/etc/filebeat-ilm-policy.json:/etc/filebeat-ilm-policy.json:ro"

logging_filebeat_pki_volumes:
  - "{{ certificates_dir }}/ca-certificate.crt:/etc/ca-certificate.crt:ro"
  - "{{ certificates_dir }}/{{ logging_filebeat_certificate_name }}.crt:/etc/{{ logging_filebeat_certificate_name }}.crt:ro"
  - "{{ certificates_dir }}/{{ logging_filebeat_certificate_name }}.key:/etc/{{ logging_filebeat_certificate_name }}.key:ro"

logging_filebeat_kubernetes_enabled: auto
logging_filebeat_kubernetes_legacy: true
logging_filebeat_kubernetes_volumes:
  - "{{ logging_kubeconfig_path }}:/kube_config:ro"
  - "/var/lib/kubelet/pods:/var/lib/kubelet/pods:ro"

logging_filebeat_docker_enabled: auto
logging_filebeat_docker_volumes:
  - "/var/run/docker.sock:/var/run/docker.sock:Z"
  - "/var/lib/docker/containers:/var/lib/docker/containers:ro"

logging_filebeat_podman_enabled: auto
logging_filebeat_podman_volumes:
  - "/var/run/podman/podman.sock:/var/run/podman/podman.sock:Z"
  - "/var/lib/containers:/var/lib/containers:ro"

logging_filebeat_enable_audit_logs: false
logging_filebeat_audit_log_paths: []

# Filebeat/ECS core mappings are pulled from `filebeat export template` and cached in
# Elasticsearch as a versioned component template (filebeat-ecs-mappings-<version>); the
# SKA component below carries our custom fields. Both are composed into every per-datastream
# index template created by configure-datastream.yml.
logging_filebeat_template_enabled: "{{ logging_filebeat_ilm_enabled }}"

# Shared (also used by ska_collections.k8s.filebeat, which symlinks the tasks/templates
# that reference these)

ca_host: ca
certificates_dir: /etc/pki/tls/private
elasticsearch_api_port: 9200
elasticsearch_password: "{{ _ | mandatory('`elasticsearch_password` definition is mandatory') }}"

logging_filebeat_ska_component_name: ska-log-custom-mappings
logging_filebeat_ska_mappings_overwrite: false
# The Filebeat/ECS core mappings component alone flattens to well over the Elasticsearch
# default of 1000 fields; Filebeat's own official template raises this to 12500 for the
# same reason (see the `index.mapping.total_fields.limit` setting in `filebeat export template`).
logging_filebeat_index_total_fields_limit: 12500
# Existing `.ds-*` backing indices keep whatever mapping they were created with; updating
# templates does not retroactively fix them. Set true (globally or per-datastream via
# `rollover_after_template_update`) to roll over the data stream right after (re)writing
# its index template so new backing indices pick up the new mappings.
logging_filebeat_rollover_after_template_update: false

logging_filebeat_pipeline_name: "ska_log_parsing_pipeline"
logging_filebeat_pipeline_enabled: true

