---
# Copy this file outside source control, fill in the secret, and protect it
# with Ansible Vault before using it in a real environment.
logging_filebeat_oci_engine: docker
logging_filebeat_version: "9.3.3"
logging_filebeat_elasticsearch_address: elasticsearch.example.internal
logging_filebeat_elasticsearch_auth_method: api-key
logging_filebeat_elasticsearch_password: CHANGE_ME

# This avoids client-certificate authentication but still validates the
# Elasticsearch server certificate using its SHA-256 CA fingerprint.
elasticsearch_http_authentication: optional
logging_filebeat_ca_fingerprint: CHANGE_ME

logging_filebeat_index_pattern_prefix: prototype-infrastructure
# Enable this only after installing the SKA ingest pipeline in Elasticsearch.
logging_filebeat_pipeline_enabled: false
ska_datacentre: mid
ska_environment: development
ska_service: prototype-infrastructure
