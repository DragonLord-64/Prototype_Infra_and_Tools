# All eight user-supplied server addresses are declared below.
# Namespace: mid-cbf-monitoring. Custom port 9101 is provisional and must be verified.
servers:
- address: 192.168.8.31
- address: 192.168.8.33
- address: 192.168.8.35
- address: 192.168.8.37
- address: 192.168.8.39
- address: 192.168.8.41
- address: 192.168.8.43
- address: 192.168.8.45
nodeExporter:
  port: 9100
customExporter:
  enabled: true
  port: 9101
slack:
  enabled: false
prometheus:
  server:
    persistentVolume:
      enabled: true
      storageClass: bds1
      size: 50G
      accessModes:
      - ReadWriteOnce
    retention: 15d
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: '2'
    service:
      enabled: true
      type: ClusterIP
      servicePort: 9090
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    retentionSize: 37GB
    strategy:
      type: Recreate
    fullnameOverride: monitoring-prometheus
    image:
      repository: docker.io/prom/prometheus
      tag: v3.15.0
      digest: sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    extraConfigmapMounts:
    - name: server-targets
      configMap: monitoring-server-targets
      mountPath: /etc/prometheus/targets
      readOnly: true
  serverFiles:
    recording_rules.yml:
      groups:
      - name: data_rates
        interval: 30s
        rules:
        - record: instance:nexus_vlans_inBcastOctets:rate1m
          expr: rate(nexus_vlans_inBcastOctets[1m])
        - record: instance:nexus_vlans_inBcastPkts:rate1m
          expr: rate(nexus_vlans_inBcastPkts[1m])
        - record: instance:nexus_interfaces_broadcastPkts:rate1m
          expr: rate(nexus_interfaces_broadcastPkts[1m])
    prometheus.yml:
      scrape_configs:
      - job_name: switch-telegraf
        static_configs:
        - targets:
          - switch-telegraf:9273
      - job_name: node
        file_sd_configs:
        - files:
          - /etc/prometheus/targets/node.json
        metrics_path: '{{ .Values.global.nodeMetricsPath }}'
      - job_name: fhs
        file_sd_configs:
        - files:
          - /etc/prometheus/targets/exporters.json
        metrics_path: '{{ .Values.global.customMetricsPath }}'
      rule_files:
      - /etc/config/recording_rules.yml
      alerting:
        alertmanagers:
        - static_configs:
          - targets:
            - monitoring-alertmanager:9093
  alertmanager:
    enabled: true
    fullnameOverride: monitoring-alertmanager
    image:
      repository: docker.io/prom/alertmanager
      tag: v0.31.1@sha256:88b605de9aba0410775c1eb3438f951115054e0d307f23f274a4c705f51630c1
    configmapReload:
      enabled: false
    persistence:
      enabled: true
      storageClass: bds1
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    config:
      enabled: true
      route:
        receiver: pending-notifications
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
      - name: pending-notifications
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  enabled: true
  configmapReload:
    prometheus:
      enabled: false
telegraf:
  config:
    agent:
      interval: 10s
      round_interval: true
      metric_batch_size: 1000
      metric_buffer_limit: 10000
      flush_interval: 10s
    inputs:
    - cisco_telemetry_mdt:
        transport: grpc
        service_address: :57000
        aliases:
          nexus_interfaces: sys/intf
          nexus_vlans: sys/bd
          nexus_ch: sys/ch
        fielddrop:
        - clearTs
        - modTs
        - subscription
    processors:
    - regex:
        namepass:
        - nexus_interfaces_*
        tags:
        - key: dn
          pattern: phys-\[(?P<interface>[^\]]+)\]
          replacement: ${interface}
          result_key: interface
        - key: dn
          pattern: dbgIf(?P<direction>In|Out)
          replacement: ${direction}
          result_key: direction
    outputs:
    - prometheus_client:
        listen: :9273
        metric_version: 2
        path: /metrics
  service:
    enabled: true
    type: LoadBalancer
    port: 57000
    additionalPorts:
    - name: metrics
      port: 9273
      targetPort: 9273
      protocol: TCP
  containerPorts:
  - name: nxos
    containerPort: 57000
    protocol: TCP
  - name: metrics
    containerPort: 9273
    protocol: TCP
  enabled: true
  fullnameOverride: switch-telegraf
  image:
    repo: docker.io/library/telegraf
    tag: 1.40.1@sha256:e91237482edcb054c81571923c6b7cf64f06ed6087a2f9cf0bd3bc2cd8c0ed61
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
grafana:
  enabled: true
  fullnameOverride: monitoring-grafana
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.2.3
    sha: b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: bds1
    size: 2Gi
  deploymentStrategy:
    type: Recreate
  initChownData:
    enabled: false
  testFramework:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-prometheus.{{ .Release.Namespace }}.svc:9090
        isDefault: true
  dashboardProviders:
    providers.yaml:
      apiVersion: 1
      providers:
      - name: switch
        orgId: 1
        folder: Switch monitoring
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/switch
  dashboardsConfigMaps:
    switch: monitoring-switch-dashboard
  envValueFrom:
    SLACK_WEBHOOK_URL:
      secretKeyRef:
        name: monitoring-slack
        key: webhook-url
        optional: true
  extraConfigmapMounts:
  - name: slack-alerting
    configMap: monitoring-slack-alerting
    mountPath: /etc/grafana/provisioning/alerting/node-exporter-slack.yaml
    subPath: node-exporter-slack.yaml
    readOnly: true
elastic:
  existingSecret: elastic-credentials
  elasticsearch:
    image:
      repository: docker.io/library/elasticsearch
      tag: 9.5.5
      digest: sha256:320bef0140dcaa30527babaae9d7a41c0ccc001e97ab87c08171d867b89e8f4f
    persistence:
      storageClass: bds1
      size: 20Gi
    heap: 1g
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: '2'
        memory: 4Gi
  kibana:
    enabled: true
    image:
      repository: docker.io/library/kibana
      tag: 9.5.5
      digest: sha256:2302bf43b02d7497f54961cdf1308a51d2f00a9c94d4dc30a6cf1540fcc16476
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: '1'
        memory: 2Gi
  enabled: true
global:
  nodeMetricsPath: /metrics
  customMetricsPath: /metrics
