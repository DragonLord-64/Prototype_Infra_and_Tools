{{- if or .Values.kibana.enabled .Values.filebeat.enabled }}
# A normal bounded Job, not a post-install hook (which would deadlock --wait).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elastic-small.name" . }}-setup-{{ .Release.Revision }}
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 0}
      containers:
        - name: setup-service-users
          image: {{ include "elastic-small.esImage" . | quote }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: elastic-password}
            {{- if .Values.kibana.enabled }}
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: kibana-password}
            {{- end }}
            {{- if .Values.filebeat.enabled }}
            - name: FILEBEAT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: filebeat-password}
            {{- end }}
          command: [/bin/bash, -ec]
          args:
            - |
              # Passwords are read from Secret-backed environment variables; never log them.
              {{- if .Values.kibana.enabled }}
              [[ "$KIBANA_PASSWORD" =~ ^[a-fA-F0-9]{32,}$ ]] || { echo "kibana-password must be at least 32 hexadecimal characters"; exit 1; }
              {{- end }}
              {{- if .Values.filebeat.enabled }}
              [[ "$FILEBEAT_PASSWORD" =~ ^[a-fA-F0-9]{32,}$ ]] || { echo "filebeat-password must be at least 32 hexadecimal characters"; exit 1; }
              {{- end }}
              put() {
                curl --fail --silent --connect-timeout 2 --max-time 5 \
                  --user "elastic:${ELASTIC_PASSWORD}" --request PUT \
                  --header 'Content-Type: application/json' --data-binary @- \
                  "http://{{ include "elastic-small.name" . }}:9200/$1" >/dev/null
              }
              configure() {
                {{- if .Values.kibana.enabled }}
                printf '{"password":"%s"}' "$KIBANA_PASSWORD" | put '_security/user/kibana_system/_password' || return 1
                {{- end }}
                {{- if .Values.filebeat.enabled }}
                put '_security/role/filebeat_writer' <<'ROLE' || return 1
              {"cluster":["monitor","read_ilm","read_pipeline"],"indices":[{"names":["filebeat-*"],"privileges":["auto_configure","create_doc"]}]}
              ROLE
                printf '{"password":"%s","roles":["filebeat_writer"]}' "$FILEBEAT_PASSWORD" | put '_security/user/filebeat_writer' || return 1
                {{- end }}
              }
              for attempt in $(seq 1 60); do
                if configure; then
                  echo "Elasticsearch service users configured"; exit 0
                fi
                sleep 5
              done
              echo "Elasticsearch did not accept service-user setup"; exit 1
{{- end }}
