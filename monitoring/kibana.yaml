# Overlay for the SAME elasticsearch-kibana release, not a second Elasticsearch release.
# Combine with elasticsearch.yaml to enable Kibana9.5.5.
kibana:
  basePath: /mid-cbf-kibana
  # Optional full external URL, including the base path and no trailing slash.
  publicBaseUrl: ''
  enabled: true
  image:
    repository: docker.io/library/kibana
    tag: 9.5.5
    digest: sha256:2302bf43b02d7497f54961cdf1308a51d2f00a9c94d4dc30a6cf1540fcc16476
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '1'
      memory: 2Gi
  ingress:
    enabled: true
    className: replace-me
    host: kibana.example.invalid
    annotations: {}
    # Optional TLS: set an existing Secret name after arranging its certificate.
    tlsSecretName: ''
