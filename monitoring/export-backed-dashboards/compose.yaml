name: fhs-export-backed-compose
services:
  fhs:
    image: &python_image python@sha256:6857d2dae63e052057f2db389a7061188ac9a92a3fa8d402bde68f36df6fada1
    working_dir: /app
    command: [python, -B, replay.py, --source, fhs, --port, '9100']
    volumes: ['./sources:/app:ro']
  node:
    image: *python_image
    working_dir: /app
    command: [python, -B, replay.py, --source, node, --port, '9100']
    volumes: ['./sources:/app:ro']
  switch:
    image: *python_image
    working_dir: /app
    command: [python, -B, replay.py, --source, switch, --port, '9100']
    volumes: ['./sources:/app:ro']
  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    ports: ['127.0.0.1:${EXPORT_PROMETHEUS_PORT:-9093}:9090']
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=2d']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_FEATURE_TOGGLES_ENABLE: canvasPanelPanZoom
    ports: ['127.0.0.1:${EXPORT_GRAFANA_PORT:-3003}:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./fhs/grafana/dashboards:/var/lib/grafana/dashboards/fhs:ro
      - ./switch/grafana/dashboards:/var/lib/grafana/dashboards/switch:ro
volumes:
  grafana-data:
  prometheus-data:
