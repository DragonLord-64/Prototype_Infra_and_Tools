server:
  # 1. Ephemeral Storage Setup (No Long-Term Storage)
  persistentVolume:
    enabled: false # Disables PVC provisioning entirely; runs in-memory/ephemeral

  # 2. Set retention natively at the top level so the chart doesn't duplicate the flag
  retention: "6h"

  # 3. Force chunks to flush to disk every hour to lower memory footprints
  extraArgs:
    storage.tsdb.min-block-duration: "1h"
    storage.tsdb.max-block-duration: "1h"

  # 4. Protect the pod from getting randomly killed by setting resource boundaries
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2"

  # 5. Expose Prometheus Server directly via LoadBalancer
  service:
    enabled: true
    type: LoadBalancer
    servicePort: 9090

  global:
    scrape_interval: 30s
    scrape_timeout: 10s

# 4. Inject your custom prometheus.yml scrape targets
serverFiles:
  recording_rules.yml:
    groups:
    # data rate in bytes per second
    - name: data_rates
      interval: 30s
      rules:
        - record: instance:nexus_vlans_inBcastOctets:rate1m
          expr: rate(nexus_vlans_inBcastOctets[1m])
        - record: instance:nexus_vlans_inBcastPkts:rate1m
          expr: rate(nexus_vlans_inBcastPkts[1m])
        - record: instance:nexus_interfaces_broadcastPkts:rate1m
          expr: rate(nexus_interfaces_broadcastPkts[1m])
  prometheus.yml:
    scrape_configs:
      - job_name: 'switch-telegraf'
        static_configs:
          - targets: ['switch-telegraf:9273']
    rule_files:
      - "/etc/config/recording_rules.yml"

# Disable the extra infrastructure microservices
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
