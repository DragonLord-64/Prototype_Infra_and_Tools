{{- if .Values.syncJob.enabled }}
{{- if not .Values.syncJob.repos }}
{{- fail "syncJob.enabled is true but syncJob.repos is empty. Add the repos to mirror, or set syncJob.enabled=false." }}
{{- end }}
# The git-repo manifest, rendered from values and mounted into the sync
# sidecar. This is the whole config path: edit `syncJob.repos`, run
# `helm upgrade`, and the kubelet refreshes the mounted file in place --
# the next reconcile pass picks it up without restarting the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "air-gapped-mirror.fullname" . }}-manifest
  labels:
    {{- include "air-gapped-mirror.labels" . | nindent 4 }}
data:
  git-repos.yaml: |
{{ dict "repos" .Values.syncJob.repos | toYaml | indent 4 }}
{{- end }}
