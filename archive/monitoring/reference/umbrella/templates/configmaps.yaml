{{- $node := list -}}
{{- $custom := list -}}
{{- range .Values.servers -}}
{{- $name := default .address .name -}}
{{- $nodePort := default $.Values.nodeExporter.port .nodeExporterPort -}}
{{- $node = append $node (dict "targets" (list (printf "%s:%v" .address $nodePort)) "labels" (dict "host" $name)) -}}
{{- if $.Values.customExporter.enabled -}}
{{- $customPort := required "Set customExporter.port or each server.customExporterPort before enabling custom scraping" (default $.Values.customExporter.port .customExporterPort) -}}
{{- $custom = append $custom (dict "targets" (list (printf "%s:%v" .address $customPort)) "labels" (dict "host" $name)) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-server-targets
  namespace: {{ .Release.Namespace }}
data:
  node.json: {{ $node | toJson | quote }}
  exporters.json: {{ $custom | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-switch-dashboard
  namespace: {{ .Release.Namespace }}
data:
  switch.json: |
    {{- .Files.Get "files/switch-dashboard.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-slack-alerting
  namespace: {{ .Release.Namespace }}
data:
  node-exporter-slack.yaml: |
    {{- if .Values.slack.enabled }}
    {{- .Files.Get "files/node-exporter-slack.yaml" | replace "REPLACE_PROMETHEUS_UID" "prometheus" | nindent 4 }}
    {{- else }}
    apiVersion: 1
    {{- end }}
