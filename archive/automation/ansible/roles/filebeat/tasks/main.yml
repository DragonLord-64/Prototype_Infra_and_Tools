---
- name: Validate the Filebeat container engine
  ansible.builtin.assert:
    that:
      - logging_filebeat_oci_engine == 'docker'
    fail_msg: >-
      This prototype supports Docker only; set logging_filebeat_oci_engine to docker.

- name: Prepare Filebeat configuration
  ansible.builtin.include_tasks: install-filebeat-common.yml

- name: Install Filebeat with Docker
  ansible.builtin.include_tasks: install-filebeat-docker.yml
