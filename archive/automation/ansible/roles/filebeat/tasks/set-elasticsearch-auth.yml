# `filebeat_config` is a local variable that must be set in the caller task
- name: Set basic authentication parameters
  when: filebeat_config.elasticsearch_auth_method == 'basic'
  ansible.builtin.set_fact:
    username: "{{ filebeat_config.elasticsearch_user }}"
    password: "{{ filebeat_config.elasticsearch_password }}"
    headers: {}
    # Send credentials on the first request instead of waiting for a 401
    # challenge: Elasticsearch can close the connection on the unauthenticated
    # attempt without draining large PUT bodies, which surfaces as an SSL EOF
    force_basic: true

- name: Set api-key authentication parameters
  when: filebeat_config.elasticsearch_auth_method == 'api-key'
  ansible.builtin.set_fact:
    username: null
    password: null
    headers:
      Authorization: "ApiKey {{ filebeat_config.elasticsearch_password }}"
    force_basic: false

- name: Set unauthenticated Elasticsearch parameters
  when: filebeat_config.elasticsearch_auth_method == 'none'
  ansible.builtin.set_fact:
    username: null
    password: null
    headers: {}
    force_basic: false
