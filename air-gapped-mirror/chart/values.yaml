# Default values for the air-gapped-mirror chart.
# Override any of these with `-f my-values.yaml` or `--set key=value`.

# The four images built from this repo. There is no registry by default:
# build them locally and load them onto the node (see chart/README.md), and
# the bare names below match what you built.
image:
  # Leave empty for local images. Set it only if you do push to a registry,
  # e.g. `registry.example.com` -> registry.example.com/air-gapped-mirror/<name>:<tag>.
  registry: ""
  tag: latest
  # Never, not IfNotPresent: these images exist only on the node you loaded
  # them onto. IfNotPresent would fall back to pulling `air-gapped-mirror/<name>`
  # from Docker Hub, which is not ours -- a missing image must fail loudly
  # (ErrImageNeverPull) rather than quietly fetch a stranger's. Set this to
  # IfNotPresent if you set `registry` above.
  pullPolicy: Never

# The stock upstream image used for the file-serving sidecar. This one is a
# real Docker Hub image, so it pulls normally -- side-load it too if the
# node has no internet, and IfNotPresent will use the local copy.
nginx:
  image: nginx:1.27-alpine
  pullPolicy: IfNotPresent

replicaCount: 1

# Shared gid so the sync job and the long-running containers can all read
# and write each other's files on the shared volumes regardless of uid.
podSecurityContext:
  fsGroup: 2000

service:
  type: ClusterIP
  ports:
    git: 9418
    http: 80
    pypi: 3141
    apt: 3142

storage:
  # Empty string = use the cluster's default StorageClass.
  className: ""
  # ReadWriteOnce is correct here and needs no special provisioner: the
  # sync loop is a sidecar, so exactly one pod mounts these volumes. (This
  # is why it isn't a CronJob -- a separate sync pod could land on another
  # node and would then require ReadWriteMany.)
  accessMode: ReadWriteOnce
  sizes:
    gitRepos: 50Gi
    mirrorFiles: 200Gi
    devpiData: 50Gi
    aptCacherNgData: 50Gi

resources:
  gitDaemon:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  nginx:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  devpi:
    requests: { cpu: 100m, memory: 128Mi }
    # devpi-server starts a 50-thread waitress pool; the stack-size burst
    # during startup OOMs a 512Mi limit under a real cgroup enforcer even
    # though steady-state usage is ~50Mi.
    limits: { memory: 1024Mi }
  aptCacherNg:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  syncJob:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# The sync sidecar: re-reads the config repo every `intervalSeconds` and
# makes the volumes match it. No forge API, no webhooks, no state.
#
# Disabled by default so `helm install` works with no configuration at
# all: the four mirror services come up and are immediately usable (devpi
# and apt-cacher-ng need no config; nginx and git-daemon serve whatever is
# on the volumes). Enable this once you have a config repo to point it at.
syncJob:
  enabled: false

  # Seconds between reconciliation passes. Each pass is one `git fetch` of
  # the config repo plus one per mirrored repo, so this multiplies against
  # your repo count: 10s across 20 repos is ~180k upstream fetches a day,
  # which public forges like GitHub will rate-limit. Lower it freely for a
  # handful of internal repos; raise it if you mirror a lot of public ones.
  intervalSeconds: 60
  configRepoBranch: main

  # Clone URL of the config repo holding the manifests. Required when
  # `enabled` is true. It's a public repo, so this is a plain value with no
  # credential in it -- nothing here needs a Secret.
  #
  #   configRepoUrl: https://gitlab.com/your-org/mirror-config.git
  configRepoUrl: ""

nameOverride: ""
fullnameOverride: ""
