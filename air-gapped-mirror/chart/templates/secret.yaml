{{- if and .Values.syncJob.enabled (not .Values.syncJob.existingSecret) }}
{{- if not .Values.syncJob.configRepoUrl }}
{{- fail "syncJob.enabled is true but syncJob.configRepoUrl is not set. Either set syncJob.existingSecret to a Secret you created yourself (recommended), or set syncJob.configRepoUrl." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "air-gapped-mirror.syncSecretName" . }}
  labels:
    {{- include "air-gapped-mirror.labels" . | nindent 4 }}
type: Opaque
stringData:
  # For a private repo, embed the credential in the URL, e.g.
  # https://oauth2:<token>@gitlab.com/your-org/mirror-config.git
  CONFIG_REPO_URL: {{ .Values.syncJob.configRepoUrl | quote }}
{{- end }}
