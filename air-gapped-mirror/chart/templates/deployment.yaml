{{- $fullName := include "air-gapped-mirror.fullname" . -}}
# The 4 long-running services, as one Deployment. (The sync job is the
# separate CronJob -- not a container here.) Single replica: stateful
# w.r.t. the shared volumes, and there's no need for more than one copy on
# an internal, low-traffic network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "air-gapped-mirror.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: a second pod would try to mount the same
  # ReadWriteOnce volumes before the old one released them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "air-gapped-mirror.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Roll the pods automatically when the nginx config changes.
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
      labels:
        {{- include "air-gapped-mirror.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: git-daemon
          image: {{ include "air-gapped-mirror.image" (dict "ctx" . "name" "git-daemon") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 9418, name: git }
          volumeMounts:
            - { name: git-repos, mountPath: /var/git/repos }
          readinessProbe:
            tcpSocket: { port: 9418 }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources.gitDaemon | nindent 12 }}

        - name: nginx
          image: {{ .Values.nginx.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 80, name: http }
          volumeMounts:
            - { name: mirror-files, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}

        - name: devpi
          image: {{ include "air-gapped-mirror.image" (dict "ctx" . "name" "devpi") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 3141, name: pypi }
          volumeMounts:
            - { name: devpi-data, mountPath: /var/devpi }
          readinessProbe:
            tcpSocket: { port: 3141 }
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.devpi | nindent 12 }}

        - name: apt-cacher-ng
          image: {{ include "air-gapped-mirror.image" (dict "ctx" . "name" "apt-cacher-ng") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 3142, name: apt }
          volumeMounts:
            - { name: apt-cacher-ng-data, mountPath: /var/cache/apt-cacher-ng }
          readinessProbe:
            tcpSocket: { port: 3142 }
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.aptCacherNg | nindent 12 }}

{{- if .Values.syncJob.enabled }}
        # Sidecar, not a CronJob: Kubernetes cron can't schedule below one
        # minute, and this way a single pod owns every volume, so
        # ReadWriteOnce is always correct -- no ReadWriteMany/NFS needed.
        - name: sync
          image: {{ include "air-gapped-mirror.image" (dict "ctx" . "name" "sync-job") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "air-gapped-mirror.syncSecretName" . }}
          env:
            - { name: SYNC_INTERVAL_SECONDS, value: {{ .Values.syncJob.intervalSeconds | quote }} }
            - { name: CONFIG_REPO_BRANCH, value: {{ .Values.syncJob.configRepoBranch | quote }} }
            - { name: GIT_REPOS_ROOT, value: /var/git/repos }
            - { name: ARTIFACTS_ROOT, value: /var/mirror/files }
            - { name: CONFIG_REPO_PATH, value: /var/mirror/config-repo }
          volumeMounts:
            - { name: git-repos, mountPath: /var/git/repos }
            - { name: mirror-files, mountPath: /var/mirror/files }
            - { name: config-repo-checkout, mountPath: /var/mirror/config-repo }
          resources:
            {{- toYaml .Values.resources.syncJob | nindent 12 }}
{{- end }}

      volumes:
{{- if .Values.syncJob.enabled }}
        # No PVC: every pass re-fetches the config repo at HEAD anyway, so
        # there is nothing worth persisting across restarts.
        - { name: config-repo-checkout, emptyDir: {} }
{{- end }}
        - { name: git-repos, persistentVolumeClaim: { claimName: {{ $fullName }}-git-repos } }
        - { name: mirror-files, persistentVolumeClaim: { claimName: {{ $fullName }}-mirror-files } }
        - { name: devpi-data, persistentVolumeClaim: { claimName: {{ $fullName }}-devpi-data } }
        - { name: apt-cacher-ng-data, persistentVolumeClaim: { claimName: {{ $fullName }}-apt-cacher-ng-data } }
        - { name: nginx-conf, configMap: { name: {{ $fullName }}-nginx-conf } }
