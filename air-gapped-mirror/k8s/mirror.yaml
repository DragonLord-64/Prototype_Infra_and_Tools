# Everything except the real secret (see secret.example.yaml -- copy it to
# secret.yaml, fill in real values, apply separately; that file is
# gitignored). All PVCs need a storage class supporting ReadWriteMany --
# the Deployment's containers and the CronJob's pods mount the same
# volumes concurrently.
apiVersion: v1
kind: Namespace
metadata:
  name: air-gapped-mirror
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-repos
  namespace: air-gapped-mirror
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-files
  namespace: air-gapped-mirror
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 200Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-state
  namespace: air-gapped-mirror
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssh-authorized-keys
  namespace: air-gapped-mirror
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devpi-data
  namespace: air-gapped-mirror
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apt-cacher-ng-data
  namespace: air-gapped-mirror
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: air-gapped-mirror
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        location / { try_files $uri $uri/ =404; }
        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    }
---
# The 4 long-running services from the design plus the SSH upload sidecar
# they share a filesystem with, as one Deployment. (The 5th component in
# the design, the sync job, is the separate CronJob below -- not a
# container here.) Single replica: stateful w.r.t. the RWX volumes, no
# need for more than one copy on an internal, low-traffic network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror
  namespace: air-gapped-mirror
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: air-gapped-mirror }
  template:
    metadata:
      labels: { app: air-gapped-mirror }
    spec:
      # Shared gid so the sync job, ssh-upload, and nginx can all see
      # files written by each other on the RWX volumes regardless of uid.
      securityContext:
        fsGroup: 2000
      # fsGroup makes the mount group-writable, but sshd's
      # ChrootDirectory refuses to log anyone in if its root is
      # group/other-writable -- pin that one directory back to root:root
      # 755 on every start; subdirectories stay group-writable.
      initContainers:
        - name: fix-chroot-perms
          image: alpine:3.20
          command: ["sh", "-c", "chown root:root /var/mirror/files && chmod 755 /var/mirror/files"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: mirror-files, mountPath: /var/mirror/files }
      containers:
        - name: git-daemon
          image: REGISTRY/air-gapped-mirror/git-daemon:latest
          ports: [{ containerPort: 9418, name: git }]
          volumeMounts: [{ name: git-repos, mountPath: /var/git/repos }]
          readinessProbe: { tcpSocket: { port: 9418 }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          volumeMounts:
            - { name: mirror-files, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

        - name: devpi
          image: REGISTRY/air-gapped-mirror/devpi:latest
          ports: [{ containerPort: 3141, name: pypi }]
          volumeMounts: [{ name: devpi-data, mountPath: /var/devpi }]
          readinessProbe: { tcpSocket: { port: 3141 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }

        - name: apt-cacher-ng
          image: REGISTRY/air-gapped-mirror/apt-cacher-ng:latest
          ports: [{ containerPort: 3142, name: apt }]
          volumeMounts: [{ name: apt-cacher-ng-data, mountPath: /var/cache/apt-cacher-ng }]
          readinessProbe: { tcpSocket: { port: 3142 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }

        - name: ssh-upload
          image: REGISTRY/air-gapped-mirror/ssh-upload:latest
          ports: [{ containerPort: 2222, name: sftp }]
          volumeMounts:
            - { name: mirror-files, mountPath: /var/mirror/files }
            - { name: ssh-authorized-keys, mountPath: /etc/ssh/authorized_keys }
          readinessProbe: { tcpSocket: { port: 2222 }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
      volumes:
        - { name: git-repos, persistentVolumeClaim: { claimName: git-repos } }
        - { name: mirror-files, persistentVolumeClaim: { claimName: mirror-files } }
        - { name: devpi-data, persistentVolumeClaim: { claimName: devpi-data } }
        - { name: apt-cacher-ng-data, persistentVolumeClaim: { claimName: apt-cacher-ng-data } }
        - { name: ssh-authorized-keys, persistentVolumeClaim: { claimName: ssh-authorized-keys } }
        - { name: nginx-conf, configMap: { name: nginx-conf } }
---
# ClusterIP is enough -- only reachable from the trusted internal (192)
# network in the first place.
apiVersion: v1
kind: Service
metadata:
  name: mirror
  namespace: air-gapped-mirror
spec:
  selector: { app: air-gapped-mirror }
  ports:
    - { name: git, port: 9418, targetPort: 9418 }
    - { name: http, port: 80, targetPort: 80 }
    - { name: pypi, port: 3141, targetPort: 3141 }
    - { name: apt, port: 3142, targetPort: 3142 }
    - { name: sftp, port: 2222, targetPort: 2222 }
---
# Polls the GitLab API for merged MRs (audit trail only -- no webhook is
# reachable, see the top-level README) and reconciles the shared volumes
# against the manifests in the private config repo on every run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mirror-sync
  namespace: air-gapped-mirror
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext: { fsGroup: 2000 }
          containers:
            - name: sync
              image: REGISTRY/air-gapped-mirror/sync-job:latest
              envFrom: [{ secretRef: { name: sync-job-secrets } }]
              env:
                - { name: GITLAB_PROJECT, value: "your-org/mirror-config" }
                - { name: GIT_REPOS_ROOT, value: /var/git/repos }
                - { name: ARTIFACTS_ROOT, value: /var/mirror/files }
                - { name: AUTHORIZED_KEYS_PATH, value: /var/mirror/ssh/uploader }
                - { name: STATE_PATH, value: /var/mirror/state/sync-state.json }
                - { name: CONFIG_REPO_PATH, value: /var/mirror/config-repo }
              volumeMounts:
                - { name: git-repos, mountPath: /var/git/repos }
                - { name: mirror-files, mountPath: /var/mirror/files }
                - { name: mirror-state, mountPath: /var/mirror/state }
                - { name: ssh-authorized-keys, mountPath: /var/mirror/ssh }
              resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumes:
            - { name: git-repos, persistentVolumeClaim: { claimName: git-repos } }
            - { name: mirror-files, persistentVolumeClaim: { claimName: mirror-files } }
            - { name: mirror-state, persistentVolumeClaim: { claimName: mirror-state } }
            - { name: ssh-authorized-keys, persistentVolumeClaim: { claimName: ssh-authorized-keys } }
