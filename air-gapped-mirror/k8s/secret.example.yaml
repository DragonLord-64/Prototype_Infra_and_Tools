# Template only -- do NOT commit real credentials. Copy to secret.yaml
# (gitignored), fill in real values, apply separately from mirror.yaml.
#
# GITLAB_TOKEN needs read-only API + read_repository scope on the config
# repo: enough to poll merged MRs and clone the private repo, nothing more.
apiVersion: v1
kind: Secret
metadata:
  name: sync-job-secrets
  namespace: air-gapped-mirror
type: Opaque
stringData:
  GITLAB_TOKEN: "REPLACE_ME_read_only_pat"
  CONFIG_REPO_URL: "https://oauth2:REPLACE_ME_read_only_pat@gitlab.com/your-org/mirror-config.git"
