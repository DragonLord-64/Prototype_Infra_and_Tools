---
# Optional shared export settings, not another server inventory.
# Export every device of this exact NetBox model; replace it.
bifrost_device_type: REPLACE_WITH_NETBOX_DEVICE_TYPE_MODEL
# Or set a numeric NetBox device-type ID, e.g. bifrost_device_type: 42
bifrost_provisioning_tag: provisioning-interface
# Supply these paths with -e or here; YAML, JSON and Ansible Vault are supported.
netbox_credentials_file: private/netbox.json
redfish_credentials_file: private/redfish.yml
# In the separate private/redfish.yml file (encrypt with Ansible Vault):
# redfish_credentials:
#   defaults:
#     redfish_username: ACTUAL_USER
#     redfish_password: ACTUAL_SECRET
#   devices:
#     NETBOX_NAME_REQUIRING_DIFFERENT_AUTH:
#       redfish_password: DIFFERENT_SECRET

# Common deployment defaults; optional NetBox per-device settings override them.
bifrost_root_device: {size: "> 900"}
bifrost_capabilities: boot_mode:uefi
