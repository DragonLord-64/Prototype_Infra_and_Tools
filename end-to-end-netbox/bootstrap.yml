---
- name: Discover servers and bootstrap NetBox directly
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  # Use your existing YAML/JSON/Vault vars files; these paths are demo defaults.
  vars_files:
    - "{{ netbox_credentials_file | default('private/netbox.yml') }}"
  vars:
    # Override netbox_validate_certs in inventory, a vars file, or extra vars.
    netbox_validate_certs_default: false
    hardware_command_path: "{{ '/opt/netbox-demo/bin:/usr/sbin:/usr/bin:/sbin:/bin' if hardware_simulation | default(false) | bool else '/usr/sbin:/usr/bin:/sbin:/bin' }}"
    resource_field_definitions: {cpu_arch: text, ram: integer, cpus: integer, disk_size: integer}
    unavailable_values: ['', unknown, 'not specified', 'not available', none, 'to be filled by o.e.m.']
    facts: "{{ hostvars[inventory_hostname].ansible_facts }}"
    netbox_site: "{{ server_info.site | default(bootstrap_site | default('Bootstrap Lab')) }}"
    netbox_role: "{{ server_info.role | default(bootstrap_role | default('Server')) }}"
    netbox_manufacturer: "{{ bootstrap_manufacturer | default('Generic') }}"
    netbox_device_type: "{{ bootstrap_device_type | default('Discovered Linux server') }}"
    netbox_auth: "{{ ('Bearer ' if netbox_token.startswith('nbt_') else 'Token ') ~ netbox_token }}"
  module_defaults:
    ansible.builtin.uri:
      validate_certs: "{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}"
    group/netbox.netbox.netbox:
      netbox_url: "{{ netbox_url }}"
      netbox_token: "{{ netbox_token }}"
      validate_certs: "{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}"

  tasks:
    - name: Discover standard facts over SSH
      tags: [always, facts]
      become: false
      block:
        - name: Gather OS and network facts
          ansible.builtin.setup:

        - name: Verify simulation is restricted to the dedicated Docker target
          ansible.builtin.stat:
            path: /opt/netbox-demo/SIMULATION
          register: simulation_marker
          when: hardware_simulation | default(false) | bool

        - name: Reject simulation on real servers
          ansible.builtin.assert:
            that:
              - facts.hostname == 'netbox-demo-ubuntu'
              - facts.virtualization_type == 'docker'
              - simulation_marker.stat.exists
            fail_msg: Hardware simulation is allowed only on the dedicated marked Docker test container.
          when: hardware_simulation | default(false) | bool

        - name: Start interface discovery list
          ansible.builtin.set_fact:
            discovered_interfaces: []
            hardware_fields: {}
            resource_fields: {}
            netbox_resource_fields: {}
            resource_field_types: {}
            disk_candidates: []
            discovered_components: []
            memory_records: []
            discovered_nics: {}
            selected_primary_ipv4: ''
            ip_ownership: []
            mac_ownership: []

        - name: Normalize each interface and its addresses
          ansible.builtin.set_fact:
            discovered_interfaces: "{{ discovered_interfaces + [discovered_interface] }}"
          vars:
            interface: "{{ facts[item] }}"
            raw_addresses: "{{ ([interface.ipv4] if interface.ipv4 is defined else []) + (interface.ipv4_secondaries | default([])) + (interface.ipv6 | default([])) }}"
            discovered_interface:
              name: "{{ item }}"
              mac: "{{ interface.macaddress | default('') }}"
              mtu: "{{ interface.mtu | default(1500) }}"
              management_only: "{{ (interface.mgmt_only | default(false) | bool) or (item | lower in ['bmc', 'lo']) or (item in bootstrap_management_only_interfaces | default([])) }}"
              lan_eligible: "{{ interface.type | default('ether') in ['ether', 'bonding'] and not ((interface.mgmt_only | default(false) | bool) or (item | lower in ['bmc', 'lo']) or (item in bootstrap_management_only_interfaces | default([]))) }}"
              addresses: "{{ raw_addresses if netbox_include_local_addresses | default(false) | bool else raw_addresses | rejectattr('address', 'match', '^(127\\.|169\\.254\\.|::1$|[Ff][Ee][89AaBb][0-9A-Fa-f]:)') | list }}"
          loop: "{{ facts.interfaces | sort }}"
          loop_control:
            label: "{{ item }}"

        - name: Show discovered server
          ansible.builtin.debug:
            msg: "{{ facts.hostname }}: {{ facts.distribution }} {{ facts.distribution_version }}"

    - name: Read provisioning metadata from the server
      tags: [always, facts]
      become: false
      block:
        - name: Check for server metadata
          ansible.builtin.stat:
            path: /etc/server-info.yaml
          register: server_info_file

        - name: Initialize optional server metadata
          ansible.builtin.set_fact:
            server_info: {}

        - name: Read server metadata without modifying it
          ansible.builtin.slurp:
            src: /etc/server-info.yaml
          register: server_info_contents
          when: server_info_file.stat.exists

        - name: Parse server metadata
          ansible.builtin.set_fact:
            server_info: "{{ server_info_contents.content | b64decode | from_yaml }}"
          when: server_info_file.stat.exists

        - name: Validate provisioning metadata before NetBox writes
          ansible.builtin.assert:
            that:
              - server_info is mapping
              - server_info.keys() | difference(['site', 'role', 'rack', 'location']) | length == 0
              - server_info.site is defined and server_info.role is defined
              - server_info.rack is defined and server_info.location is defined
            fail_msg: /etc/server-info.yaml must contain site, role, rack and location as nonempty strings.
          when: server_info_file.stat.exists

        - name: Validate metadata values
          ansible.builtin.assert:
            that:
              - item.value is string
              - item.value | trim | length > 0
            fail_msg: Server metadata values must be nonempty strings.
          loop: "{{ server_info | dict2items }}"

        - name: Normalize metadata whitespace
          ansible.builtin.set_fact:
            server_info: "{{ server_info | combine({item.key: item.value | trim}) }}"
          loop: "{{ server_info | dict2items }}"

    - name: Gather measured CPU architecture RAM and logical CPU count
      tags: [always, facts]
      become: false
      block:
        - name: Record available architecture
          ansible.builtin.set_fact:
            resource_fields: "{{ resource_fields | combine({'cpu_arch': facts.architecture}) }}"
          when: facts.architecture | default('') | lower not in unavailable_values

        - name: Record available RAM in MiB
          ansible.builtin.set_fact:
            resource_fields: "{{ resource_fields | combine({'ram': facts.memtotal_mb | int}) }}"
          when: facts.memtotal_mb | default(0) | int > 0

        - name: Read logical CPU count only if the fact is unavailable
          ansible.builtin.command:
            argv: [nproc]
          register: cpu_count_probe
          changed_when: false
          failed_when: false
          check_mode: false
          when: facts.processor_vcpus | default(0) | int <= 0

        - name: Record available logical CPU count
          ansible.builtin.set_fact:
            resource_fields: "{{ resource_fields | combine({'cpus': logical_cpus | int}) }}"
          vars:
            logical_cpus: "{{ facts.processor_vcpus | default(0) if facts.processor_vcpus | default(0) | int > 0 else cpu_count_probe.stdout | default(0) }}"
          when: logical_cpus | int > 0

    - name: Discover server BIOS
      tags: [bios, compare, apply]
      become: "{{ not (hardware_simulation | default(false) | bool) }}"
      environment:
        PATH: "{{ hardware_command_path }}"
        LC_ALL: C
        LANG: C
      block:
        - name: Read BIOS information
          ansible.builtin.command:
            argv: [dmidecode, --type, bios]
          register: bios_probe
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Report unavailable BIOS information
          ansible.builtin.debug:
            msg: "BIOS unavailable; existing NetBox values will be preserved: {{ bios_probe.stderr | default(bios_probe.msg | default('No diagnostic returned'), true) }}"
          when: bios_probe.rc != 0 or ((bios_probe.stdout | default('')) | regex_findall('(?m)^\\s*Version:\\s*(.+)$') | first | default('') | trim | lower in unavailable_values)

        - name: Record available BIOS version
          ansible.builtin.set_fact:
            hardware_fields: "{{ hardware_fields | combine({'bios_version': bios_version}) }}"
          vars:
            bios_version: "{{ (bios_probe.stdout | default('')) | regex_findall('(?m)^\\s*Version:\\s*(.+)$') | first | default('') | trim }}"
          when: bios_probe.rc == 0 and bios_version | lower not in unavailable_values

    - name: Discover motherboard and BMC
      tags: [bmc, compare, apply]
      become: "{{ not (hardware_simulation | default(false) | bool) }}"
      environment:
        PATH: "{{ hardware_command_path }}"
        LC_ALL: C
        LANG: C
      block:
        - name: Read BMC firmware information
          ansible.builtin.command:
            argv: [ipmitool, mc, info]
          register: bmc_info_probe
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Read BMC management LAN channel
          ansible.builtin.command:
            argv: [ipmitool, lan, print, "{{ bmc_lan_channel | default('1') }}"]
          register: bmc_lan_probe
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Read motherboard FRU information
          ansible.builtin.command:
            argv: [ipmitool, fru, print, "{{ motherboard_fru_id | default('0') }}"]
          register: motherboard_probe
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Record available motherboard and BMC fields
          ansible.builtin.set_fact:
            hardware_fields: "{{ hardware_fields | combine({item.key: item.value}) }}"
          vars:
            available_fields:
              bmc_firmware: "{{ (bmc_info_probe.stdout | default('')) | regex_findall('(?m)^Firmware Revision\\s*:\\s*(.+)$') | first | default('') | trim }}"
              motherboard_part_number: "{{ (motherboard_probe.stdout | default('')) | regex_findall('(?m)^\\s*Board Part Number\\s*:\\s*(.+)$') | first | default('') | trim }}"
              motherboard_serial: "{{ (motherboard_probe.stdout | default('')) | regex_findall('(?m)^\\s*Board Serial\\s*:\\s*(.+)$') | first | default('') | trim }}"
          loop: "{{ available_fields | dict2items }}"
          when: item.value | lower not in unavailable_values and ((item.key == 'bmc_firmware' and bmc_info_probe.rc == 0) or (item.key != 'bmc_firmware' and motherboard_probe.rc == 0))

        - name: Record available BMC address
          ansible.builtin.set_fact:
            bmc_address: "{{ discovered_bmc_address }}"
          vars:
            discovered_bmc_address: "{{ (bmc_lan_probe.stdout | default('')) | regex_findall('(?m)^IP Address\\s*:\\s*([0-9.]+)\\s*$') | first | default('') }}"
          when: bmc_lan_probe.rc == 0 and discovered_bmc_address | length > 0 and discovered_bmc_address != '0.0.0.0'

        - name: Show BMC discovery and explicitly report unavailable fields
          ansible.builtin.debug:
            msg:
              simulation: "{{ hardware_simulation | default(false) | bool }}"
              motherboard_and_firmware: "{{ hardware_fields }}"
              bmc_address: "{{ bmc_address | default('unavailable; existing value preserved') }}"
              unavailable_probes: "{{ [bmc_info_probe, bmc_lan_probe, motherboard_probe] | rejectattr('rc', 'equalto', 0) | map(attribute='msg', default='IPMI read failed') | list }}"
              unavailable_fields: "{{ ['bmc_firmware', 'motherboard_part_number', 'motherboard_serial'] | difference(hardware_fields.keys() | list) }}"

    - name: Discover DDR5 modules
      tags: [ddr, compare, apply]
      become: "{{ not (hardware_simulation | default(false) | bool) }}"
      environment:
        PATH: "{{ hardware_command_path }}"
        LC_ALL: C
        LANG: C
      block:
        - name: Read memory device information
          ansible.builtin.command:
            argv: [dmidecode, --type, memory]
          register: memory_probe
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Report unavailable memory information
          ansible.builtin.debug:
            msg: "Memory inventory unavailable; existing NetBox components preserved: {{ memory_probe.stderr | default(memory_probe.msg | default('No diagnostic returned'), true) }}"
          when: memory_probe.rc != 0 or (memory_probe.stdout | default('')) | regex_findall('(?m)^[ \\t]*Memory Device[ \\t\\r]*$') | length == 0

        - name: Parse populated DDR5 memory records
          ansible.builtin.set_fact:
            memory_records: "{{ memory_records + [memory_record] }}"
          vars:
            slot: "{{ memory_block | regex_findall('(?m)^\\s*Locator:\\s*(.+)$') | first | default('') | trim }}"
            bank: "{{ memory_block | regex_findall('(?m)^\\s*Bank Locator:\\s*(.+)$') | first | default('') | trim }}"
            dmi_handle: "{{ memory_block | regex_findall('(?m)^\\s*Handle\\s+(0x[0-9A-Fa-f]+),') | first | default('') }}"
            memory_type: "{{ memory_block | regex_findall('(?m)^\\s*Type:\\s*(.+)$') | first | default('') | trim }}"
            memory_size: "{{ memory_block | regex_findall('(?m)^\\s*Size:\\s*(.+)$') | first | default('') | trim }}"
            part: "{{ memory_block | regex_findall('(?m)^\\s*Part Number:\\s*(.+)$') | first | default('') | trim }}"
            component_serial: "{{ memory_block | regex_findall('(?m)^\\s*Serial Number:\\s*(.+)$') | first | default('') | trim }}"
            memory_record:
              slot: "{{ slot if slot | lower not in unavailable_values else 'DMI ' ~ dmi_handle }}"
              bank: "{{ bank }}"
              handle: "{{ dmi_handle }}"
              part: "{{ part if part | lower not in unavailable_values else '' }}"
              serial: "{{ component_serial if component_serial | lower not in unavailable_values else '' }}"
          loop: "{{ (memory_probe.stdout | default('') | replace('\\r', '')) | regex_findall('(?ms)^(?:[ \\t]*Handle[^\\n]*\\n)?[ \\t]*Memory Device[ \\t]*\\n.*?(?=^[ \\t]*Handle|^[ \\t]*Memory Device[ \\t]*$|\\Z)') }}"
          loop_control:
            loop_var: memory_block
            label: "{{ slot | default('unknown slot') }}"
          when: memory_probe.rc == 0 and memory_type | upper == 'DDR5' and memory_size | lower not in ['no module installed', 'unknown', '']

        - name: Keep every DDR5 slot distinct
          ansible.builtin.set_fact:
            discovered_components: "{{ discovered_components + [memory_component] }}"
          vars:
            same_slot: "{{ memory_records | selectattr('slot', 'equalto', dimm.slot) | list }}"
            unique_bank: "{{ dimm.bank | lower not in unavailable_values and (same_slot | selectattr('bank', 'equalto', dimm.bank) | list | length == 1) }}"
            suffix: "{{ dimm.bank if unique_bank else dimm.handle }}"
            memory_component:
              name: "DDR5 {{ dimm.slot }}{{ (' [' ~ suffix ~ ']') if same_slot | length > 1 else '' }}"
              kind: DDR5
              part: "{{ dimm.part }}"
              serial: "{{ dimm.serial }}"
          loop: "{{ memory_records }}"
          loop_control:
            loop_var: dimm
            label: "{{ dimm.slot }}"

    - name: Discover NVMe drives
      tags: [nvme, compare, apply]
      become: "{{ not (hardware_simulation | default(false) | bool) }}"
      environment:
        PATH: "{{ hardware_command_path }}"
        LC_ALL: C
        LANG: C
      block:
        - name: Read NVMe drive list as JSON
          ansible.builtin.command:
            argv: [nvme, list, -o, json]
          register: nvme_probe
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Report unavailable NVMe information
          ansible.builtin.debug:
            msg: "NVMe inventory unavailable; existing NetBox components preserved: {{ nvme_probe.stderr | default(nvme_probe.msg | default('No diagnostic returned'), true) }}"
          when: nvme_probe.rc != 0

        - name: Validate NVMe JSON contract before mapping
          ansible.builtin.assert:
            that:
              - (nvme_probe.stdout | from_json).Devices is defined
              - (nvme_probe.stdout | from_json).Devices is sequence
            fail_msg: Expected non-verbose nvme list JSON with a Devices array; review this nvme-cli version before applying.
          when: nvme_probe.rc == 0

        - name: Validate NVMe namespace identifiers
          ansible.builtin.assert:
            that:
              - item.DevicePath is defined
              - item.DevicePath is match('^/dev/nvme[0-9]+n[0-9]+$')
            fail_msg: NVMe JSON schema or namespace path is unsupported; review raw output before applying.
          loop: "{{ (nvme_probe.stdout | from_json).Devices if nvme_probe.rc == 0 else [] }}"
          loop_control:
            label: "{{ item.DevicePath | default('unsupported record') }}"

        - name: Record discovered NVMe drives
          ansible.builtin.set_fact:
            discovered_components: "{{ discovered_components + [drive_component] }}"
          vars:
            part: "{{ item.ModelNumber | default('') | trim }}"
            component_serial: "{{ item.SerialNumber | default('') | trim }}"
            drive_component:
              name: "NVMe {{ item.DevicePath }}"
              kind: NVMe
              part: "{{ part if part | lower not in unavailable_values else '' }}"
              serial: "{{ component_serial if component_serial | lower not in unavailable_values else '' }}"
          loop: "{{ ((nvme_probe.stdout | default('')) | from_json).Devices if nvme_probe.rc == 0 else [] }}"
          loop_control:
            label: "{{ item.DevicePath }}"

    - name: Gather individual eligible disk capacities without summing disks
      tags: [resources, compare, apply]
      become: false
      block:
        - name: Record measured nonremovable whole-disk capacities from Linux facts
          ansible.builtin.set_fact:
            disk_candidates: "{{ disk_candidates + [{'name': '/dev/' ~ disk_fact.key, 'bytes': disk_bytes | int}] }}"
          vars:
            disk_bytes: "{{ (disk_fact.value.sectors | default(0) | int) * (disk_fact.value.sectorsize | default(512) | int) }}"
          loop: "{{ facts.devices | default({}) | dict2items | sort(attribute='key') }}"
          loop_control:
            loop_var: disk_fact
            label: "{{ disk_fact.key }}"
          when: not (hardware_simulation | default(false) | bool) and facts.virtualization_type | default('') not in ['docker', 'lxc', 'container'] and disk_fact.key is match('^(sd[a-z]+|vd[a-z]+|xvd[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+)$') and disk_fact.value.removable | default('0') | string != '1' and (disk_bytes | int // 1073741824) > 900

        - name: Record simulated disk capacities only from the marked test fixture
          ansible.builtin.set_fact:
            disk_candidates: "{{ disk_candidates + [{'name': disk_fixture.DevicePath, 'bytes': disk_fixture.PhysicalSize | int}] }}"
          loop: "{{ (nvme_probe.stdout | from_json).Devices if nvme_probe is defined and nvme_probe.rc == 0 else [] }}"
          loop_control:
            loop_var: disk_fixture
            label: "{{ disk_fixture.DevicePath }}"
          when: hardware_simulation | default(false) | bool and (disk_fixture.PhysicalSize | default(0) | int // 1073741824) > 900

        - name: Record actual common eligible capacity in whole GiB
          ansible.builtin.set_fact:
            resource_fields: "{{ resource_fields | combine({'disk_size': (disk_candidates | first).bytes | int // 1073741824}) }}"
          when: disk_candidates | length > 0 and (disk_candidates | map(attribute='bytes') | unique | list | length == 1)

        - name: Report disk capacity selection without blocking inventory
          ansible.builtin.debug:
            msg:
              eligible_disks: "{{ disk_candidates }}"
              disk_size_gib: "{{ resource_fields.disk_size | default('unavailable or differing capacities; existing value preserved') }}"
              policy: Individual nonremovable whole disks above 900 GiB; equal capacities are interchangeable for this informational field. No install target is chosen or disk written.

    - name: Discover NIC PCI inventory identities
      tags: [nic, compare, apply]
      become: false
      environment:
        LC_ALL: C
      block:
        - name: Group network ports by PCI function
          ansible.builtin.set_fact:
            discovered_nics: "{{ discovered_nics | combine({pci_address: {'interfaces': existing_ports + [interface_name]}}) }}"
          vars:
            pci_address: "{{ facts[interface_name].pciid }}"
            existing_ports: "{{ discovered_nics[pci_address].interfaces | default([]) }}"
          loop: "{{ facts.interfaces | sort }}"
          loop_control:
            loop_var: interface_name
          when: bootstrap_collect_pci_nics | default(true) | bool and facts[interface_name].pciid is defined and facts[interface_name].pciid is match('^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}\\.[0-7]$')

        - name: Read standard PCI uevent identity
          ansible.builtin.slurp:
            src: "/sys/bus/pci/devices/{{ nic_function.key }}/uevent"
          loop: "{{ discovered_nics | dict2items }}"
          loop_control:
            loop_var: nic_function
          register: nic_identity_probes
          failed_when: false

        - name: Record PCI NIC inventory items without inventing part or serial numbers
          ansible.builtin.set_fact:
            discovered_components: "{{ discovered_components + [nic_component] }}"
          vars:
            identity_text: "{{ nic_probe.content | default('') | b64decode }}"
            pci_id: "{{ identity_text | regex_findall('(?m)^PCI_ID=(.+)$') | first | default('unavailable') }}"
            driver: "{{ identity_text | regex_findall('(?m)^DRIVER=(.+)$') | first | default('unavailable') }}"
            ports: "{{ nic_probe.nic_function.value.interfaces }}"
            nic_component:
              name: "NIC {{ nic_probe.nic_function.key }}"
              kind: NIC
              part: ''
              serial: ''
              interface: "{{ ports | first if ports | length == 1 else '' }}"
              details: "PCI function {{ nic_probe.nic_function.key }}; PCI ID {{ pci_id }}; driver {{ driver }}; ports {{ ports | join(', ') }}. Part/serial not exposed by standard uevent."
          loop: "{{ nic_identity_probes.results }}"
          loop_control:
            loop_var: nic_probe
            label: "{{ nic_probe.nic_function.key }}"

        - name: Validate user-discovered NIC card records
          ansible.builtin.assert:
            that:
              - nic_card.name is defined
              - nic_card.name | string | length > 0
              - nic_card.interface | default('') == '' or nic_card.interface in facts.interfaces
            fail_msg: NIC cards need a stable name and any supplied interface must exist on this server.
          loop: "{{ bootstrap_nic_cards | default([]) }}"
          loop_control:
            loop_var: nic_card

        - name: Record supplied NIC inventory cards
          ansible.builtin.set_fact:
            discovered_components: "{{ discovered_components + [nic_component] }}"
          vars:
            nic_component:
              name: "NIC {{ nic_card.name }}"
              kind: NIC
              part: "{{ nic_card.part | default('') | string | trim }}"
              serial: "{{ nic_card.serial | default('') | string | trim }}"
              interface: "{{ nic_card.interface | default('') }}"
          loop: "{{ bootstrap_nic_cards | default([]) }}"
          loop_control:
            loop_var: nic_card

        - name: Report whether standard NIC inventory is available
          ansible.builtin.debug:
            msg: "Found {{ discovered_nics | length }} PCI NIC functions. Vendor-specific part/serial discovery needs the user's read-only command/output; virtual container ports are not physical cards."

    - name: Map user-discovered FPGA cards into inventory items
      tags: [fpga, compare, apply]
      become: false
      block:
        - name: Validate supplied FPGA card identities and optional interface
          ansible.builtin.assert:
            that:
              - fpga_card.name is defined
              - fpga_card.name | string | length > 0
              - fpga_card.interface | default('') == '' or fpga_card.interface in facts.interfaces
            fail_msg: FPGA records need a unique stable slot/name and any supplied interface must exist on this server.
          loop: "{{ bootstrap_fpga_cards | default([]) }}"
          loop_control:
            loop_var: fpga_card

        - name: Record supplied FPGA inventory cards
          ansible.builtin.set_fact:
            discovered_components: "{{ discovered_components + [fpga_component] }}"
          vars:
            fpga_component:
              name: "FPGA {{ fpga_card.name }}"
              kind: FPGA
              part: "{{ fpga_card.part | default('') | string | trim }}"
              serial: "{{ fpga_card.serial | default('') | string | trim }}"
              interface: "{{ fpga_card.interface | default('') }}"
          loop: "{{ bootstrap_fpga_cards | default([]) }}"
          loop_control:
            loop_var: fpga_card

        - name: Report FPGA command integration status
          ansible.builtin.debug:
            msg: FPGA inventory mapping is ready; no SDK command is assumed. Supply parsed bootstrap_fpga_cards or add the reviewed SDK discovery block before this block.
          when: bootstrap_fpga_cards | default([]) | length == 0

    - name: Reject component names that would overwrite another discovered component
      tags: [ddr, nvme, nic, fpga, compare, apply]
      ansible.builtin.assert:
        that:
          - component_names | length == component_names | unique | length
          - "'DDR5 DMI ' not in component_names"
        fail_msg: Discovered component names collide; provide distinct slot/namespace identifiers before writing NetBox.
      vars:
        component_names: "{{ discovered_components | map(attribute='name') | list }}"

    - name: Select discovered management primary IPv4
      tags: [compare, apply]
      block:
        - name: Select requested IPv4 or the first eligible LAN IPv4 without requiring a default route
          ansible.builtin.set_fact:
            selected_primary_ipv4: "{{ primary_candidates | first | default({}) }}"
          vars:
            all_ipv4: "{{ discovered_interfaces | rejectattr('management_only') | map(attribute='addresses') | flatten | rejectattr('address', 'search', ':') | rejectattr('address', 'match', '^(127\\.|169\\.254\\.|0\\.)') | list }}"
            lan_ipv4: "{{ discovered_interfaces | selectattr('lan_eligible') | map(attribute='addresses') | flatten | rejectattr('address', 'search', ':') | rejectattr('address', 'match', '^(127\\.|169\\.254\\.|0\\.)') | list }}"
            primary_candidates: "{{ (all_ipv4 | selectattr('address', 'equalto', bootstrap_primary_ipv4) | list) if bootstrap_primary_ipv4 is defined else lan_ipv4 }}"

        - name: Report unavailable primary IPv4 selection
          ansible.builtin.debug:
            msg: Requested/first-LAN primary IPv4 was not discovered; existing NetBox primary IPv4 will be preserved.
          when: selected_primary_ipv4.address is not defined

    - name: Show hardware discovery and omitted component fields
      tags: [bios, bmc, ddr, nvme, nic, fpga, compare, apply]
      ansible.builtin.debug:
        msg:
          simulation: "{{ hardware_simulation | default(false) | bool }}"
          firmware_and_motherboard: "{{ hardware_fields }}"
          ddr5_component_count: "{{ discovered_components | selectattr('kind', 'equalto', 'DDR5') | list | length }}"
          nvme_component_count: "{{ discovered_components | selectattr('kind', 'equalto', 'NVMe') | list | length }}"
          nic_component_count: "{{ discovered_components | selectattr('kind', 'equalto', 'NIC') | list | length }}"
          fpga_component_count: "{{ discovered_components | selectattr('kind', 'equalto', 'FPGA') | list | length }}"
          components: "{{ discovered_components }}"
          missing_part_numbers: "{{ discovered_components | selectattr('part', 'equalto', '') | map(attribute='name') | list }}"
          missing_serial_numbers: "{{ discovered_components | selectattr('serial', 'equalto', '') | map(attribute='name') | list }}"

    - name: Compare discovered facts with NetBox
      tags: [compare, apply]
      delegate_to: localhost
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      block:
        - name: Read existing device
          ansible.builtin.uri:
            url: "{{ netbox_url }}/api/dcim/devices/?name={{ facts.hostname | urlencode }}"
            headers:
              Authorization: "{{ netbox_auth }}"
            return_content: true
          register: existing_device
          check_mode: false
          no_log: true

        - name: Read existing custom field definitions without changing their types
          ansible.builtin.uri:
            url: "{{ netbox_url }}/api/extras/custom-fields/?limit=1000"
            headers:
              Authorization: "{{ netbox_auth }}"
            return_content: true
          register: existing_resource_definitions
          check_mode: false
          no_log: true

        - name: Remember existing resource field types
          ansible.builtin.set_fact:
            resource_field_types: "{{ resource_field_types | combine({definition.name: definition.type.value | default(definition.type)}) }}"
          loop: "{{ existing_resource_definitions.json.results }}"
          loop_control:
            loop_var: definition
          when: definition.name in resource_field_definitions
          no_log: true

        - name: Adapt measured resource values to existing field types
          ansible.builtin.set_fact:
            netbox_resource_fields: "{{ netbox_resource_fields | combine({resource.key: stored_value}) }}"
          vars:
            field_type: "{{ resource_field_types[resource.key] | default(resource_field_definitions[resource.key]) }}"
            stored_value: "{{ resource.value | string if field_type in ['text', 'longtext'] else (resource.value | float if field_type == 'decimal' else resource.value | int) }}"
          loop: "{{ resource_fields | dict2items }}"
          loop_control:
            loop_var: resource
          when: (resource.key == 'cpu_arch' and field_type in ['text', 'longtext']) or (resource.key != 'cpu_arch' and field_type in ['integer', 'decimal', 'text', 'longtext'])

        - name: Report unavailable or incompatible optional resource fields
          ansible.builtin.debug:
            msg: "Omitted resource fields preserve existing values: {{ resource_field_definitions.keys() | list | difference(netbox_resource_fields.keys() | list) }}"

        - name: Reject ambiguous device names and duplicate discovery identities
          ansible.builtin.assert:
            that:
              - existing_device.json.count <= 1
              - fleet_hostnames | length == fleet_hostnames | unique | length
              - fleet_ips | length == fleet_ips | unique | length
              - fleet_macs | length == fleet_macs | unique | length
            fail_msg: Duplicate device names, addresses, or shared MACs need review before any NetBox writes. Use a separate VRF/site-aware design for overlapping address spaces.
          vars:
            fleet_macs: "{{ ansible_play_hosts | map('extract', hostvars, 'discovered_interfaces') | flatten | map(attribute='mac') | reject('equalto', '') | reject('equalto', '00:00:00:00:00:00') | list }}"
            fleet_hostnames: "{{ ansible_play_hosts | map('extract', hostvars, ['ansible_facts', 'hostname']) | list }}"
            fleet_ips: "{{ (ansible_play_hosts | map('extract', hostvars, 'discovered_interfaces') | flatten | map(attribute='addresses') | flatten | map(attribute='address') | list) + (ansible_play_hosts | map('extract', hostvars) | selectattr('bmc_address', 'defined') | map(attribute='bmc_address') | list) }}"

        - name: Read ownership of desired IP addresses
          ansible.builtin.uri:
            url: "{{ netbox_url }}/api/ipam/ip-addresses/?address={{ (item.1.address ~ '/' ~ item.1.prefix) | urlencode }}"
            headers:
              Authorization: "{{ netbox_auth }}"
            return_content: true
          loop: "{{ (discovered_interfaces | subelements('addresses')) + ([[{'name': 'bmc'}, {'address': bmc_address, 'prefix': 32}]] if bmc_address is defined else []) }}"
          register: ip_owners
          check_mode: false
          no_log: true

        - name: Retain only nonsecret IP ownership details
          ansible.builtin.set_fact:
            ip_ownership: "{{ ip_ownership + [ownership] }}"
          vars:
            ownership:
              address: "{{ item.item.1.address }}"
              interface: "{{ item.item.0.name }}"
              count: "{{ item.json.count }}"
              device_names: "{{ item.json.results | selectattr('assigned_object') | map(attribute='assigned_object.device.name', default='') | list }}"
              interface_names: "{{ item.json.results | selectattr('assigned_object') | map(attribute='assigned_object.name', default='') | list }}"
          loop: "{{ ip_owners.results }}"
          no_log: true

        - name: Stop before reassigning IPs belonging to other interfaces
          ansible.builtin.assert:
            that:
              - item.count <= 1
              - item.device_names | reject('equalto', facts.hostname) | list | length == 0
              - item.interface_names | reject('equalto', item.interface) | list | length == 0
            fail_msg: An IP is ambiguous or already belongs to another interface/device; review the conflict instead of automatically moving it.
          loop: "{{ ip_ownership }}"
          loop_control:
            label: "{{ item.interface }}: {{ item.address }}"

        - name: Read ownership of desired MAC addresses
          ansible.builtin.uri:
            url: "{{ netbox_url }}/api/dcim/mac-addresses/?mac_address={{ item.mac | urlencode }}"
            headers:
              Authorization: "{{ netbox_auth }}"
            return_content: true
          loop: "{{ discovered_interfaces }}"
          when: item.mac | length > 0 and item.mac != '00:00:00:00:00:00'
          register: mac_owners
          check_mode: false
          no_log: true

        - name: Retain only nonsecret MAC ownership details
          ansible.builtin.set_fact:
            mac_ownership: "{{ mac_ownership + [ownership] }}"
          vars:
            ownership:
              interface: "{{ item.item.name }}"
              count: "{{ item.json.count }}"
              device_names: "{{ item.json.results | selectattr('assigned_object') | map(attribute='assigned_object.device.name', default='') | list }}"
              interface_names: "{{ item.json.results | selectattr('assigned_object') | map(attribute='assigned_object.name', default='') | list }}"
          loop: "{{ mac_owners.results | selectattr('json', 'defined') | list }}"
          no_log: true

        - name: Stop before reassigning MACs belonging to other interfaces
          ansible.builtin.assert:
            that:
              - item.count <= 1
              - item.device_names | reject('equalto', facts.hostname) | list | length == 0
              - item.interface_names | reject('equalto', item.interface) | list | length == 0
            fail_msg: A MAC is ambiguous or belongs to another interface/device; review before moving it.
          loop: "{{ mac_ownership }}"
          loop_control:
            label: "{{ item.interface }}"

        - name: Refuse to treat previously simulated hardware as real inventory
          ansible.builtin.assert:
            that:
              - hardware_simulation | default(false) | bool or 'simulated-hardware' not in ((existing_device.json.results | first | default({})).tags | default([]) | map(attribute='name') | list)
            fail_msg: This NetBox device has simulated hardware. Use a separate real-server record or explicitly review the simulated fields first.

        - name: Read existing interfaces addresses and components for preview
          ansible.builtin.uri:
            url: "{{ netbox_url }}/api/{{ item }}/?device={{ facts.hostname | urlencode }}&limit=1000"
            headers:
              Authorization: "{{ netbox_auth }}"
            return_content: true
          loop: [dcim/interfaces, ipam/ip-addresses, dcim/inventory-items]
          register: existing_network
          check_mode: false
          no_log: true
          when: (ansible_check_mode or 'compare' in ansible_run_tags) and existing_device.json.count > 0

        - name: Preview desired facts alongside existing records
          ansible.builtin.debug:
            msg:
              desired_hostname: "{{ facts.hostname }}"
              desired_os_version: "{{ facts.distribution }} {{ facts.distribution_version }}"
              desired_site: "{{ netbox_site }}"
              desired_role: "{{ netbox_role }}"
              desired_rack: "{{ server_info.rack | default('unavailable; preserve existing') }}"
              desired_rack_location: "{{ server_info.location | default('unavailable; preserve existing') }}"
              desired_device_type: "{{ netbox_device_type }}"
              desired_interfaces: "{{ discovered_interfaces }}"
              desired_resource_fields: "{{ netbox_resource_fields }}"
              desired_hardware_fields: "{{ hardware_fields }}"
              desired_components: "{{ discovered_components }}"
              current_primary_ipv4: "{{ (existing_device.json.results | first | default({})).primary_ip4.address | default('not set') }}"
              desired_primary_ipv4: "{{ (selected_primary_ipv4.address ~ '/' ~ selected_primary_ipv4.prefix) if selected_primary_ipv4.address is defined else 'unavailable; preserve existing' }}"
              desired_bmc_address: "{{ bmc_address | default('unavailable; omit') }}"
              simulation: "{{ hardware_simulation | default(false) | bool }}"
              current_devices: "{{ existing_device.json.results }}"
              current_network: "{{ existing_network.results | default([]) | selectattr('json', 'defined') | map(attribute='json.results') | list }}"
          when: ansible_check_mode or 'compare' in ansible_run_tags

    - name: Reject conflicting locations for a shared rack before NetBox writes
      tags: [always, facts]
      ansible.builtin.assert:
        that:
          - matching_rack_metadata | map(attribute='location') | unique | length == 1
        fail_msg: Servers assign conflicting locations to the same rack within a site; correct their server-info.yaml files before applying.
      vars:
        matching_rack_metadata: "{{ ansible_play_hosts | map('extract', hostvars, 'server_info') | selectattr('site', 'defined') | selectattr('site', 'equalto', server_info.site) | selectattr('rack', 'equalto', server_info.rack) | list }}"
      when: server_info.rack is defined

    - name: Ensure minimal NetBox prerequisites
      tags: [apply]
      when: not ansible_check_mode
      throttle: 1
      delegate_to: localhost
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      block:
        - name: Ensure site
          netbox.netbox.netbox_site:
            data:
              name: "{{ netbox_site }}"
              slug: "{{ netbox_site | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"

        - name: Ensure rack location within the site
          netbox.netbox.netbox_location:
            data:
              name: "{{ server_info.location }}"
              site: "{{ netbox_site }}"
            query_params: [name, site]
          register: ensured_location
          when: server_info.location is defined

        - name: Ensure rack within the site and location
          netbox.netbox.netbox_rack:
            data:
              name: "{{ server_info.rack }}"
              site: "{{ netbox_site }}"
              location: "{{ ensured_location.location.id }}"
            query_params: [name, site]
          register: ensured_rack
          when: server_info.rack is defined

        - name: Ensure server role
          netbox.netbox.netbox_device_role:
            data:
              name: "{{ netbox_role }}"
              slug: "{{ netbox_role | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"
              color: 2196f3

        - name: Ensure generic manufacturer
          netbox.netbox.netbox_manufacturer:
            data:
              name: "{{ netbox_manufacturer }}"
              slug: "{{ netbox_manufacturer | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"

        - name: Ensure discovered server type
          netbox.netbox.netbox_device_type:
            data:
              manufacturer: "{{ netbox_manufacturer }}"
              model: "{{ netbox_device_type }}"
              slug: "{{ netbox_device_type | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"
              u_height: 0

        - name: Ensure OS version field
          netbox.netbox.netbox_custom_field:
            data:
              name: os_version
              label: OS version
              type: text
              object_types: [dcim.device]

        - name: Ensure discovered hardware fields
          netbox.netbox.netbox_custom_field:
            data:
              name: "{{ item }}"
              type: text
              object_types: [dcim.device]
          loop: [bios_version, bmc_firmware, motherboard_part_number, motherboard_serial]

        - name: Create only missing resource custom fields
          netbox.netbox.netbox_custom_field:
            data:
              name: "{{ resource_definition.key }}"
              type: "{{ resource_definition.value }}"
              object_types: [dcim.device]
          loop: "{{ resource_field_definitions | dict2items }}"
          loop_control:
            loop_var: resource_definition
          when: resource_definition.key not in resource_field_types

        - name: Ensure explicit simulated hardware tag
          netbox.netbox.netbox_tag:
            data:
              name: simulated-hardware
              slug: simulated-hardware
              color: ff9800
          when: hardware_simulation | default(false) | bool

    - name: Apply discovered server inventory to NetBox
      tags: [apply]
      when: not ansible_check_mode
      delegate_to: localhost
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      block:
        - name: Ensure server device
          netbox.netbox.netbox_device:
            data:
              name: "{{ facts.hostname }}"
              site: "{{ netbox_site }}"
              rack: "{{ ensured_rack.rack.id if server_info.rack is defined else omit }}"
              location: "{{ ensured_location.location.id if server_info.location is defined else omit }}"
              device_role: "{{ netbox_role }}"
              device_type: "{{ netbox_device_type }}"
              status: active
              custom_fields: "{{ {'os_version': facts.distribution ~ ' ' ~ facts.distribution_version} | combine(hardware_fields) | combine(netbox_resource_fields) }}"
              tags: "{{ ((existing_device.json.results | first | default({})).tags | default([]) | map(attribute='name') | list + ['simulated-hardware']) | unique if hardware_simulation | default(false) | bool else omit }}"
              description: "{{ 'Ubuntu test container: hardware fields are SIMULATED fixtures.' if hardware_simulation | default(false) | bool else omit }}"

        - name: Ensure discovered interfaces
          netbox.netbox.netbox_device_interface:
            data:
              device: "{{ facts.hostname }}"
              name: "{{ item.name }}"
              type: "{{ 'virtual' if item.name == 'lo' else 'other' }}"
              mtu: "{{ item.mtu }}"
          loop: "{{ discovered_interfaces }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Ensure MAC objects (NetBox 4.2+)
          netbox.netbox.netbox_mac_address:
            data:
              mac_address: "{{ item.mac }}"
              assigned_object:
                device: "{{ facts.hostname }}"
                name: "{{ item.name }}"
          loop: "{{ discovered_interfaces }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.mac | length > 0 and item.mac != '00:00:00:00:00:00'

        - name: Set interface primary MACs
          netbox.netbox.netbox_device_interface:
            data:
              device: "{{ facts.hostname }}"
              name: "{{ item.name }}"
              primary_mac_address: "{{ item.mac }}"
          loop: "{{ discovered_interfaces }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.mac | length > 0 and item.mac != '00:00:00:00:00:00'

        - name: Ensure discovered IPv4 and IPv6 addresses
          netbox.netbox.netbox_ip_address:
            data:
              address: "{{ item.1.address }}/{{ item.1.prefix }}"
              assigned_object:
                device: "{{ facts.hostname }}"
                name: "{{ item.0.name }}"
              status: active
          loop: "{{ discovered_interfaces | subelements('addresses') }}"
          loop_control:
            label: "{{ item.0.name }}: {{ item.1.address }}"

        - name: Assign discovered management primary IPv4 after address creation
          netbox.netbox.netbox_device:
            data:
              name: "{{ facts.hostname }}"
              primary_ip4:
                address: "{{ selected_primary_ipv4.address }}/{{ selected_primary_ipv4.prefix }}"
          when: selected_primary_ipv4.address is defined

        - name: Ensure DDR5 NVMe NIC and FPGA inventory components
          netbox.netbox.netbox_inventory_item:
            query_params: [device, name]
            data:
              device: "{{ facts.hostname }}"
              name: "{{ item.name }}"
              component_type: "{{ 'dcim.interface' if item.interface | default('') | length > 0 else omit }}"
              component: "{{ {'device': facts.hostname, 'name': item.interface} if item.interface | default('') | length > 0 else omit }}"
              tags: "{{ ['simulated-hardware'] if hardware_simulation | default(false) | bool else omit }}"
              part_id: "{{ item.part if item.part | lower not in unavailable_values else omit }}"
              serial: "{{ item.serial if item.serial | lower not in unavailable_values else omit }}"
              description: "{{ ('SIMULATED fixture: ' if hardware_simulation | default(false) | bool else 'Discovered: ') ~ item.kind ~ (': ' ~ item.details if item.details is defined else '') }}"
          loop: "{{ discovered_components }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Ensure motherboard BMC interface
          netbox.netbox.netbox_device_interface:
            data:
              device: "{{ facts.hostname }}"
              name: bmc
              type: other
              mgmt_only: true
              description: "{{ 'SIMULATED motherboard BMC management' if hardware_simulation | default(false) | bool else 'Motherboard BMC management' }}"
          when: bmc_address is defined

        - name: Ensure motherboard BMC management address
          netbox.netbox.netbox_ip_address:
            data:
              address: "{{ bmc_address }}/32"
              assigned_object:
                device: "{{ facts.hostname }}"
                name: bmc
              status: active
          when: bmc_address is defined

        - name: Assign server out-of-band management IP
          netbox.netbox.netbox_device:
            data:
              name: "{{ facts.hostname }}"
              oob_ip: "{{ bmc_address }}/32"
          when: bmc_address is defined
