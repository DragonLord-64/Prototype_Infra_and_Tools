---
- name: Require a safe exact serial selector
  ansible.builtin.assert:
    that:
      - poap_serial is string
      - poap_serial is match('^[A-Za-z0-9_.-]+$')

- name: Read the NetBox device by serial
  ansible.builtin.set_fact:
    poap_devices: '{{ query("netbox.netbox.nb_lookup", "devices", api_endpoint=netbox_url, token=netbox_token, validate_certs=netbox_validate_certs | default(poap_netbox_validate_certs) | bool, api_filter="serial=" ~ poap_serial, raw_data=true) }}'
  no_log: true

- name: Require exactly one matching switch
  ansible.builtin.assert:
    that:
      - poap_devices | length == 1
      - poap_devices[0].serial == poap_serial
    fail_msg: 'Serial {{ poap_serial }} is missing or ambiguous in NetBox.'

- name: Read the configured management interface
  ansible.builtin.set_fact:
    poap_interfaces: '{{ query("netbox.netbox.nb_lookup", "interfaces", api_endpoint=netbox_url, token=netbox_token, validate_certs=netbox_validate_certs | default(poap_netbox_validate_certs) | bool, api_filter="device_id=" ~ (poap_devices[0].id | string) ~ " name=" ~ (poap_management_interface | quote), raw_data=true) }}'
  no_log: true

- name: Require exactly one enabled management interface
  ansible.builtin.assert:
    that:
      - poap_interfaces | length == 1
      - poap_interfaces[0].name == poap_management_interface
      - poap_interfaces[0].enabled
    fail_msg: 'Serial {{ poap_serial }} needs one enabled {{ poap_management_interface }} interface.'

- name: Read IP addresses assigned to that interface
  ansible.builtin.set_fact:
    poap_addresses: '{{ query("netbox.netbox.nb_lookup", "ip-addresses", api_endpoint=netbox_url, token=netbox_token, validate_certs=netbox_validate_certs | default(poap_netbox_validate_certs) | bool, api_filter="interface_id=" ~ (poap_interfaces[0].id | string), raw_data=true) }}'
  no_log: true

- name: Normalize the management MAC address and IPv4 prefix
  ansible.builtin.set_fact:
    poap_switches: '{{ poap_switches + [poap_devices[0] | poap_switch_record(poap_interfaces[0], poap_addresses, poap_gateways_by_serial.get(poap_serial, poap_gateway))] }}'
