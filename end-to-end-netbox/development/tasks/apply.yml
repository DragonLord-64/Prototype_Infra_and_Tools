- name: Ensure minimal NetBox prerequisites
  tags:
  - apply
  when: not ansible_check_mode
  throttle: 1
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  block:
  - name: Ensure site
    netbox.netbox.netbox_site:
      data:
        name: '{{ netbox_site }}'
        slug: '{{ netbox_site | lower | regex_replace(''[^a-z0-9]+'', ''-'') | trim(''-'') }}'
  - name: Ensure rack location within the site
    netbox.netbox.netbox_location:
      data:
        name: '{{ server_info.location }}'
        site: '{{ netbox_site }}'
      query_params:
      - name
      - site
    register: ensured_location
    when: server_info.location is defined
  - name: Ensure rack within the site and location
    netbox.netbox.netbox_rack:
      data:
        name: '{{ server_info.rack }}'
        site: '{{ netbox_site }}'
        location: '{{ ensured_location.location.id }}'
      query_params:
      - name
      - site
    register: ensured_rack
    when: server_info.rack is defined
  - name: Ensure server role
    netbox.netbox.netbox_device_role:
      data:
        name: '{{ netbox_role }}'
        slug: '{{ netbox_role | lower | regex_replace(''[^a-z0-9]+'', ''-'') | trim(''-'') }}'
        color: 2196f3
    register: role_output
  - name: Ensure generic manufacturer
    netbox.netbox.netbox_manufacturer:
      data:
        name: '{{ netbox_manufacturer }}'
        slug: '{{ netbox_manufacturer | lower | regex_replace(''[^a-z0-9]+'', ''-'') | trim(''-'') }}'
  - name: Ensure discovered server type
    netbox.netbox.netbox_device_type:
      data:
        manufacturer: '{{ netbox_manufacturer }}'
        model: '{{ netbox_device_type }}'
        slug: '{{ netbox_device_type | lower | regex_replace(''[^a-z0-9]+'', ''-'') | trim(''-'') }}'
        u_height: 0
  - name: Ensure OS version field
    netbox.netbox.netbox_custom_field:
      data:
        name: os_version
        label: OS version
        type: text
        object_types:
        - dcim.device
  - name: Ensure discovered hardware fields
    netbox.netbox.netbox_custom_field:
      data:
        name: '{{ item }}'
        type: text
        object_types:
        - dcim.device
    loop:
    - bios_version
    - bmc_firmware
    - motherboard_part_number
    - motherboard_serial
    loop_control:
      pause: 1
  - name: Create only missing resource custom fields
    netbox.netbox.netbox_custom_field:
      data:
        name: '{{ resource_definition.key }}'
        type: '{{ resource_definition.value }}'
        object_types:
        - dcim.device
    loop: '{{ resource_field_definitions | dict2items }}'
    loop_control:
      loop_var: resource_definition
    when: resource_definition.key not in resource_field_types
  - name: Ensure explicit simulated hardware tag
    netbox.netbox.netbox_tag:
      data:
        name: simulated-hardware
        slug: simulated-hardware
        color: ff9800
    when: hardware_simulation | default(false) | bool
- name: Apply discovered server inventory to NetBox
  tags:
  - apply
  when: not ansible_check_mode
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  block:
  - name: Ensure server device
    netbox.netbox.netbox_device:
      data:
        name: '{{ facts.hostname }}'
        site: '{{ netbox_site }}'
        rack: '{{ ensured_rack.rack.id if server_info.rack is defined else omit }}'
        location: '{{ ensured_location.location.id if server_info.location is defined else omit }}'
        device_role: '{{ role_output.device_role.id }}'
        device_type: '{{ netbox_device_type }}'
        status: active
        custom_fields: '{{ {''os_version'': facts.distribution ~ '' '' ~ facts.distribution_version} | combine(hardware_fields) | combine(netbox_resource_fields)
          }}'
        tags: '{{ ((existing_device.json.results | first | default({})).tags | default([]) | map(attribute=''name'') | list + [''simulated-hardware''])
          | unique if hardware_simulation | default(false) | bool else omit }}'
        description: '{{ ''Ubuntu test container: hardware fields are SIMULATED fixtures.'' if hardware_simulation | default(false) | bool else omit }}'
  - name: Ensure discovered interfaces
    netbox.netbox.netbox_device_interface:
      data:
        device: '{{ facts.hostname }}'
        name: '{{ item.name }}'
        type: '{{ ''virtual'' if item.name == ''lo'' else ''other'' }}'
        mtu: '{{ item.mtu }}'
    loop: '{{ discovered_interfaces }}'
    loop_control:
      label: '{{ item.name }}'
  - name: Ensure MAC objects (NetBox 4.2+)
    netbox.netbox.netbox_mac_address:
      data:
        mac_address: '{{ item.mac }}'
        assigned_object:
          device: '{{ facts.hostname }}'
          name: '{{ item.name }}'
    loop: '{{ discovered_interfaces }}'
    loop_control:
      label: '{{ item.name }}'
    when: item.mac | length > 0 and item.mac != '00:00:00:00:00:00'
  - name: Set interface primary MACs
    netbox.netbox.netbox_device_interface:
      data:
        device: '{{ facts.hostname }}'
        name: '{{ item.name }}'
        primary_mac_address: '{{ item.mac }}'
    loop: '{{ discovered_interfaces }}'
    loop_control:
      label: '{{ item.name }}'
    when: item.mac | length > 0 and item.mac != '00:00:00:00:00:00'
  - name: Ensure discovered IPv4 and IPv6 addresses
    netbox.netbox.netbox_ip_address:
      data:
        address: '{{ item.1.address }}/{{ item.1.prefix }}'
        assigned_object:
          device: '{{ facts.hostname }}'
          name: '{{ item.0.name }}'
        status: active
    loop: '{{ discovered_interfaces | subelements(''addresses'') }}'
    loop_control:
      label: '{{ item.0.name }}: {{ item.1.address }}'
  - name: Assign discovered management primary IPv4 after address creation
    netbox.netbox.netbox_device:
      data:
        name: '{{ facts.hostname }}'
        primary_ip4:
          address: '{{ selected_primary_ipv4.address }}/{{ selected_primary_ipv4.prefix }}'
    when: selected_primary_ipv4.address is defined
  - name: Ensure legacy DDR5 NVMe and NIC inventory components
    netbox.netbox.netbox_inventory_item:
      query_params:
      - device
      - name
      data:
        device: '{{ facts.hostname }}'
        name: '{{ item.name }}'
        component_type: '{{ ''dcim.interface'' if item.interface | default('''') | length > 0 else omit }}'
        component: '{{ {''device'': facts.hostname, ''name'': item.interface} if item.interface | default('''') | length > 0 else omit }}'
        tags: '{{ [''simulated-hardware''] if hardware_simulation | default(false) | bool else omit }}'
        part_id: '{{ item.part if item.part | lower not in unavailable_values else omit }}'
        serial: '{{ item.serial if item.serial | lower not in unavailable_values else omit }}'
        custom_fields: '{{ ( {''fpga_bmc_firmware'': item.bmc_firmware} if item.bmc_firmware | default('''') | length > 0 else {} ) | combine({''pci_endpoints'':
          item.pci_endpoints} if item.pci_endpoints | default([]) | length > 0 else {}) or omit }}'
        description: '{{ (''SIMULATED fixture: '' if hardware_simulation | default(false) | bool else ''Discovered: '') ~ item.kind ~ ('': '' ~ item.details
          if item.details is defined else '''') }}'
    loop: '{{ discovered_components }}'
    loop_control:
      label: '{{ item.name }}'
    throttle: 1
    when: item.kind | default('') not in ['FPGA', 'Transceiver']
  - name: Ensure motherboard BMC interface
    netbox.netbox.netbox_device_interface:
      data:
        device: '{{ facts.hostname }}'
        name: bmc
        type: other
        mgmt_only: true
        description: '{{ ''SIMULATED motherboard BMC management'' if hardware_simulation | default(false) | bool else ''Motherboard BMC management'' }}'
    when: bmc_address is defined
  - name: Ensure motherboard BMC management address
    netbox.netbox.netbox_ip_address:
      data:
        address: '{{ bmc_address }}/32'
        assigned_object:
          device: '{{ facts.hostname }}'
          name: bmc
        status: active
    when: bmc_address is defined
  - name: Assign server out-of-band management IP
    netbox.netbox.netbox_device:
      data:
        name: '{{ facts.hostname }}'
        oob_ip: '{{ bmc_address }}/32'
    when: bmc_address is defined
- name: Preview or apply FPGA modules and their three interfaces
  tags:
  - fpga
  - compare
  - apply
  delegate_to: localhost
  connection: local
  become: false
  throttle: 1
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  fhs_fpga_sync:
    netbox_url: '{{ netbox_url }}'
    netbox_token: '{{ netbox_token }}'
    validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
    device: '{{ facts.hostname }}'
    cards: '{{ desired_fpga_cards | default([]) }}'
    preview: '{{ ansible_check_mode or ''compare'' in ansible_run_tags or ''facts'' in ansible_run_tags }}'
  register: fpga_plan
- name: Show FPGA module plan
  tags:
  - fpga
  - compare
  - apply
  ansible.builtin.debug:
    var: fpga_plan.plan
