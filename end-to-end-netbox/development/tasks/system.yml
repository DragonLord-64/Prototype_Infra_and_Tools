- name: Discover standard facts over SSH
  tags:
  - always
  - facts
  become: false
  block:
  - name: Gather OS and network facts
    ansible.builtin.setup: null
  - name: Verify simulation is restricted to the dedicated Docker target
    ansible.builtin.stat:
      path: /opt/netbox-demo/SIMULATION
    register: simulation_marker
    when: hardware_simulation | default(false) | bool
  - name: Reject simulation on real servers
    ansible.builtin.assert:
      that:
      - facts.hostname == 'netbox-demo-ubuntu'
      - facts.virtualization_type == 'docker'
      - simulation_marker.stat.exists
      fail_msg: Hardware simulation is allowed only on the dedicated marked Docker test container.
    when: hardware_simulation | default(false) | bool
  - name: Start interface discovery list
    ansible.builtin.set_fact:
      discovered_interfaces: []
      hardware_fields: {}
      resource_fields: {}
      netbox_resource_fields: {}
      resource_field_types: {}
      disk_candidates: []
      discovered_components: []
      memory_records: []
      discovered_nics: {}
      fpga_enriched_components: []
      selected_primary_ipv4: ''
      ip_ownership: []
      mac_ownership: []
      desired_fpga_cards: []
      discovered_bittware:
        cards: []
      desired_nic_cards: []
      nic_discovery_warnings: []
  - name: Normalize each interface and its addresses
    ansible.builtin.set_fact:
      discovered_interfaces: '{{ discovered_interfaces + [discovered_interface] }}'
    vars:
      interface: '{{ facts[item] }}'
      raw_addresses: '{{ ([interface.ipv4] if interface.ipv4 is defined else []) + (interface.ipv4_secondaries | default([])) + (interface.ipv6 | default([]))
        }}'
      discovered_interface:
        name: '{{ item }}'
        mac: '{{ interface.macaddress | default('''') }}'
        mtu: '{{ interface.mtu | default(1500) }}'
        management_only: '{{ (interface.mgmt_only | default(false) | bool) or (item | lower in [''bmc'', ''lo'']) or (item in bootstrap_management_only_interfaces
          | default([])) }}'
        lan_eligible: '{{ interface.type | default(''ether'') in [''ether'', ''bonding''] and not ((interface.mgmt_only | default(false) | bool) or (item
          | lower in [''bmc'', ''lo'']) or (item in bootstrap_management_only_interfaces | default([]))) }}'
        addresses: '{{ raw_addresses if netbox_include_local_addresses | default(false) | bool else raw_addresses | rejectattr(''address'', ''match'', ''^(127\.|169\.254\.|::1$|[Ff][Ee][89AaBb][0-9A-Fa-f]:)'')
          | list }}'
    loop: '{{ facts.interfaces | sort }}'
    loop_control:
      label: '{{ item }}'
  - name: Show discovered server
    ansible.builtin.debug:
      msg: '{{ facts.hostname }}: {{ facts.distribution }} {{ facts.distribution_version }}'
- name: Read provisioning metadata from the server
  tags:
  - always
  - facts
  become: false
  block:
  - name: Check for server metadata
    ansible.builtin.stat:
      path: /etc/server-info.yaml
    register: server_info_file
  - name: Initialize optional server metadata
    ansible.builtin.set_fact:
      server_info: {}
  - name: Read server metadata without modifying it
    ansible.builtin.slurp:
      src: /etc/server-info.yaml
    register: server_info_contents
    when: server_info_file.stat.exists
  - name: Parse server metadata
    ansible.builtin.set_fact:
      server_info: '{{ server_info_contents.content | b64decode | from_yaml }}'
    when: server_info_file.stat.exists
  - name: Validate provisioning metadata before NetBox writes
    ansible.builtin.assert:
      that:
      - server_info is mapping
      - (['site', 'role', 'rack', 'location'] | difference(server_info.keys())) | length == 0
      - server_info.site | string | trim | length > 0
      - server_info.role | string | trim | length > 0
      - server_info.rack | string | trim | length > 0
      - server_info.location | string | trim | length > 0
      fail_msg: /etc/server-info.yaml must contain site, role, rack and location as nonempty strings.
    when: server_info_file.stat.exists
  - name: Validate metadata values
    ansible.builtin.assert:
      that:
      - item.value is string
      - item.value | trim | length > 0
      fail_msg: Server metadata values must be nonempty strings.
    loop: '{{ server_info | dict2items }}'
  - name: Normalize metadata whitespace
    ansible.builtin.set_fact:
      server_info: '{{ server_info | combine({item.key: item.value | trim}) }}'
    loop: '{{ server_info | dict2items }}'
- name: Reject conflicting locations for a shared rack before NetBox writes
  tags:
  - always
  - facts
  ansible.builtin.assert:
    that:
    - matching_rack_metadata | map(attribute='location') | unique | length == 1
    fail_msg: Servers assign conflicting locations to the same rack within a site; correct their server-info.yaml files before applying.
  vars:
    matching_rack_metadata: '{{ ansible_play_hosts | map(''extract'', hostvars, ''server_info'') | selectattr(''site'', ''defined'') | selectattr(''site'',
      ''equalto'', server_info.site) | selectattr(''rack'', ''equalto'', server_info.rack) | list }}'
  when: server_info.rack is defined
